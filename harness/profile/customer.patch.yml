# Профиль заказчика (ADR-0007 rev4): zai-провайдер из окружения, остальное —
# стандартный web-app. Секретов здесь нет: ключ живёт в ZAI_API_KEY контейнера.
- insert:
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          zai:
            apiKeyEnv: ZAI_API_KEY
    # Пресет агента заказчика: агент dsh видит только инструменты своего
    # пресета (изолированная группа), глобальные узлы ему не видны.
    - id: preset-customer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: customer
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: Ты — ассистент приёма инициатив «Система БФТ». Отвечай по-русски.
              includeRuntimeContext: false
          # Уточняющие вопросы — штатной формой dsh (HowToDemo п.8).
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # Проверка ссылок заказчика; поиск выключен — ему нужен ключ DeepSeek.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              search: false
              fetch: true
          # Сдача постановки в заявку (HowToDemo п.9–10).
          - id: customer-form-tool
            name: 'customer-form/tool'

# Дефолтная модель портала — zai (rev5). Без этого каталог берёт
# deepseek-official/deepseek-flash без ключа → «Send» задизейблен.
- id: agent-default-model
  config:
    provider: zai
    model: glm-5-turbo

# Заказчику не показываем «Internal Testing Notice» dsh: версия уведомления
# считается подтверждённой (так её записывает сам dsh по кнопке Continue).
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  config:
    welcomeNoticeVersion: 2026-08-13.1

# Интерфейс заказчика — по-русски: языковой пакет регистрирует customer-form
# (клиент), здесь только выбор языка по умолчанию.
- id: locale
  config:
    preference: ru

# Чат заказчика — не агент-кодер: единственный пресет — customer (выше).
# Пресеты кодера выключены — у каждого свои bash/fs/субагенты, и любой
# посетитель портала попросил бы модель выполнить команду или прочитать
# /proc/self/environ контейнера (ZAI_API_KEY, пароль трекера).
- id: agent-preset-registry
  config:
    default: customer
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
# Глобальные инструменты тоже выключены (вне пресетов их не должно быть).
- id: tool-bash
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-workflow
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true

# Интерфейс кодера заказчику не нужен: выбор пресета, режима доступа и модели,
# команды Goal/Plan/Compact/Feedback/Export в меню «+», фоновые задачи,
# субагенты, навыки. Выбор каталога выключен — через него посетитель ходил бы
# по файловой системе контейнера (workspace плагин создаёт по пути сам).
- id: command-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: command-feedback
  disabled: true
- id: command-compact
  disabled: true
- id: session-log-download
  disabled: true
- id: directory-picker
  disabled: true
- id: ui-goal
  disabled: true
- id: ui-plan
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: ui-permission
  disabled: true
- id: ui-model-selection
  disabled: true
- id: ui-schedule
  disabled: true
- id: ui-jobs
  disabled: true
- id: ui-subagent
  disabled: true
- id: ui-skill
  disabled: true
- id: ui-workflow-run
  disabled: true
