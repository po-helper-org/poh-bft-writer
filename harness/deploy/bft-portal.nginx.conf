# poh-bft-portal: портал заказчика БФТ (dsh, harness/) под /bft/ — ADR-0014.
# Подключается в server{} хоста портала (PORTAL_TRUSTED_HOSTS) вместо poh-widget-bft.conf
# (ставит harness/deploy/install-nginx-bft.sh). Вход — Authentik (как у остальных
# приложений хоста); префикс /bft срезается, портал пишет ссылки относительно <base>.
#   /bft/  → 127.0.0.1:3082 (customer-web), WebSocket /bft/api — тот же адрес
#   /bft-sources/mcp → 127.0.0.1:3086/mcp — шлюз источников (ADR-0015), без Authentik
#   /bft/form, /bft/form/answer, /bft/preview — форма вопросов по БФТ (ADR-0018), без Authentik:
#     доступ — по ключу в ссылке (UUID формы), его проверяет портал

location = /bft {
    return 301 /bft/;
}

# Админка портала: вход по учётке Authentik (группа ADMIN_SSO_GROUPS / ADMIN_SSO_USERS).
location ~ ^/bft/admin/?$ {
    return 302 /bft/api/customer-form.admin?login=1;
}

# Форма вопросов по БФТ (ADR-0018): заказчик и команды открывают её по ссылке
# вне портала — без Authentik. Доступ — ключ в ссылке (?id=<UUID формы>), его и
# отзыв проверяет портал; наружу — только эти три точных адреса. X-Bft-Public
# говорит порталу строить соседние ссылки короткими (form, preview).
location = /bft/form {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:3082/api/customer-form.form;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Bft-Public 1;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy no-referrer always;
}
location = /bft/preview {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:3082/api/customer-form.formPreview;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Bft-Public 1;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy no-referrer always;
}
location = /bft/form/answer {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:3082/api/customer-form.formAnswer;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Bft-Public 1;
    client_max_body_size 1m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control no-store always;
}

location /bft/ {
    set $edge_gate_scope corp;
    set $edge_app bft;
    include /etc/nginx/snippets/poh-box/edge-auth.conf;

    proxy_pass http://127.0.0.1:3082/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $corp_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /bft;
    # Сборка полного БФТ и выгрузки .pdf/.docx идут минутами; чат — WebSocket.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    # Материалы заказчика: голос и документы.
    client_max_body_size 100m;
    add_header Content-Security-Policy "frame-ancestors 'self' vector:" always;
    add_header Referrer-Policy no-referrer always;
}

# Шлюз источников портала (ADR-0015): MCP только с четырьмя инструментами чтения
# Jira и Confluence. Authentik здесь не нужен и мешал бы: клиент — сам портал, вход —
# bearer-токен, который проверяет шлюз (без токена — 401). Ставит и запускает шлюз
# harness/deploy/install-sources-gateway.sh (без sudo).
location = /bft-sources/mcp {
    # Шлюз работает без сессий: нужен только POST.
    limit_except POST {
        deny all;
    }
    proxy_pass http://127.0.0.1:3086/mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Ответы MCP идут потоком (SSE) — без буферизации.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 1m;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
}
