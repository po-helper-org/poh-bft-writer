# poh-bft-portal: Temporal UI жизненного цикла БФТ (ADR-0022) — только администраторам.
# Уровень http (/etc/nginx/conf.d/poh-bft-temporal-map.conf, ставит install-nginx-bft.sh).
#
# Группы пользователя nginx узнаёт из auth_request (Authentik, $authentik_groups) — это фаза
# доступа, а `if` в location срабатывает раньше и видел бы пустую переменную. Поэтому выбор
# делается в proxy_pass через map: он вычисляется уже после входа. Администратор
# (группа «authentik Admins», как ADMIN_SSO_GROUPS портала) → Temporal UI на 127.0.0.1:3088;
# остальные → маршрут портала, который отвечает 403 (а не 502: падение самого UI видно как 502).
map $authentik_groups $bft_temporal_upstream {
    "~(^|[|])authentik Admins([|]|$)" 127.0.0.1:3088;
    default                         127.0.0.1:3082/api/customer-form.temporalForbidden;
}
