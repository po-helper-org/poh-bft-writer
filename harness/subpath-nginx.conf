# Эмулятор прода: портал под префиксом /bft/, как на
# https://portal.example.org/bft/ (nginx срезает префикс).
# Корень и /api/ хоста заняты «чужими приложениями» — здесь это ловушки 418:
# любой абсолютный адрес, ушедший из портала мимо /bft/, падает громко.
#   docker compose -f docker-compose.yml -f docker-compose.subpath.yml up -d customer-web subpath-nginx
#   PORTAL_URL=http://127.0.0.1:3090/bft ./e2e-customer.sh
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  # Редирект /bft → /bft/ — без хоста и порта контейнера (снаружи это :3090).
  absolute_redirect off;
  client_max_body_size 200m;

  location = /bft { return 301 /bft/; }

  location /bft/ {
    proxy_pass http://customer-web:3080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Host с портом (127.0.0.1:3090): по нему dsh пускает в /api (DSH_TRUSTED_HOSTS).
    # В проде (порт 443) это $host — имя домена в PORTAL_TRUSTED_HOSTS.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  location /api/ { return 418 "leaked absolute /api/ URL: $request_uri\n"; }
  location / { return 418 "leaked absolute URL outside /bft/: $request_uri\n"; }
}
