<script>
/* bft-blueprint · схемы как код. Разбор и проверка блоков ```seq``` и ```idef0``` — близнец
   diagram_dsl.py: те же правила, коды и сообщения (совпадение проверяет test-bft-blueprint.sh).
   Рисунки — статичные функции: sequence с линией видимости, IDEF0 — контекст и декомпозиция.
   Подключается после page_kit.js. Грамматика — resources/diagram_dsl.md. */
const BPD = (function () {
  "use strict";
  const KINDS = { "человек": "p", "интерфейс": "i", "система": "s", "внешний": "x" };
  const MAX_STEPS = 12, MAX_PARTS = 6, MAX_MSG = 70, MAX_DESC = 240, MAX_LABEL = 60, MIN_FN = 2, MAX_FN = 6;
  const FENCE_RE = /^```\s*(seq|idef0)\b\s*(.*?)\s*$/, FENCE_END = /^```\s*$/;
  const SEQ_ID = /^П\d+$/, IDEF_ID = /^\d{1,2}\.\d{1,2}$/;
  const PID = "[A-Za-z][A-Za-z0-9]{0,7}";
  const MSG_RE = new RegExp(`^(${PID})\\s*(-->|->)\\s*(${PID})\\s*:\\s*(.*)$`);
  const NOMSG_RE = new RegExp(`^(${PID})\\s*(-->|->)\\s*(${PID})\\s*$`);
  const DECL_RE = new RegExp(`^(человек|интерфейс|система|внешний)\\s+(${PID})\\s*:\\s*(.*)$`);
  const IF_RE = /^если(?=[\s:]|$)[\s:]*(.*)$/, ELSE_RE = /^иначе(?=[\s:]|$)[\s:]*(.*)$/, END_RE = /^конец$/;
  const DESC_RE = /^описание\s*:\s*(.*)$/;
  const KEY_RE = /^(функция|входы?|управление|регуляторы|выходы?|механизмы?)\s*:\s*(.*)$/;
  const FN_RE = /^A(\d+)\s*[:.]?\s*(.*)$/;
  const KEY_OF = { "функция": "fn", "вход": "in", "входы": "in", "управление": "ctl", "регуляторы": "ctl", "выход": "out", "выходы": "out", "механизм": "mech", "механизмы": "mech" };
  const KEY_NAME = { fn: "функция", in: "вход", ctl: "управление", out: "выход", mech: "механизм" };
  const len = s => [...s].length;
  const issue = (out, line, level, code, msg) => out.push({ line, level, code, msg });
  const sortIssues = iss => iss.slice().sort((a, b) => a.line - b.line || (a.code < b.code ? -1 : a.code > b.code ? 1 : 0));

  function splitValues(raw) {
    const vals = []; let cur = "", depth = 0;
    for (const ch of raw) {
      if (ch === "[") depth++; else if (ch === "]") depth = Math.max(0, depth - 1);
      if (ch === ";" && depth === 0) { vals.push(cur); cur = "" } else cur += ch;
    }
    vals.push(cur);
    return vals.map(v => v.trim()).filter(v => v && !["—", "-", "–"].includes(v));
  }
  const normLabel = s => s.toLowerCase().replace(/ё/g, "е").replace(/\s+/g, " ").trim().replace(/[.,;:]+$/, "").trim();

  function extract(text) {
    const lines = String(text).replace(/\r\n?/g, "\n").split("\n");
    if (lines.length && lines[lines.length - 1] === "") lines.pop();
    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].trim().match(FENCE_RE);
      if (!m) continue;
      const kind = m[1], bid = m[2].trim(), body = []; let j = i + 1;
      while (j < lines.length && !FENCE_END.test(lines[j].trim())) { body.push(lines[j]); j++ }
      const res = { kind, id: bid, body, offset: i + 1, issues: [] };
      if (j >= lines.length) issue(res.issues, body.length, "ERROR", "DG000", "блок не закрыт строкой ```");
      if (!(kind === "seq" ? SEQ_ID : IDEF_ID).test(bid))
        issue(res.issues, 0, "ERROR", "DG000", `заголовок блока: \`\`\`seq П3\`\`\` — ID процесса, \`\`\`idef0 1.2\`\`\` — ID задачи, а не «${bid}»`);
      return res;
    }
    return { kind: "", id: "", body: [], offset: 0, issues: [{ line: 0, level: "ERROR", code: "DG000", msg: "нет блока ```seq П3 … ``` или ```idef0 1.2 … ```" }] };
  }

  /* ---------- seq ---------- */
  function parseSeq(body, parts) {
    const iss = [], local = {}, declLine = {}, steps = [];
    let desc = "", descLine = 0, br = "", brLine = 0, groupN = 0, last = 0;
    const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
    body.forEach((raw, idx) => {
      const n = idx + 1, ln = raw.trim();
      if (!ln || ln.startsWith("//")) return;
      last = n;
      let m = ln.match(DESC_RE);
      if (m) {
        if (!m[1].trim()) issue(iss, n, "ERROR", "DG002", "пустое описание");
        else if (descLine) issue(iss, n, "ERROR", "DG002", `описание уже есть (строка ${descLine}) — одно на процесс`);
        else {
          desc = m[1].trim(); descLine = n;
          if (len(desc) > MAX_DESC) issue(iss, n, "WARN", "DG026", `описание ${len(desc)} знаков (больше ${MAX_DESC}) — суть в двух фразах`);
        }
        return;
      }
      m = ln.match(DECL_RE);
      if (m) {
        const kind = KINDS[m[1]], pid = m[2], name = m[3].trim();
        if (!name) issue(iss, n, "ERROR", "DG004", `участник ${pid}: нет имени`);
        else if (has(local, pid)) issue(iss, n, "ERROR", "DG004", `участник ${pid} уже объявлен (строка ${declLine[pid]})`);
        else if (has(parts, pid) && parts[pid][1] !== kind) issue(iss, n, "ERROR", "DG004", `участник ${pid} в карте — другого вида; новый — другой ID`);
        else { local[pid] = [name, kind]; declLine[pid] = n }
        return;
      }
      m = ln.match(IF_RE);
      if (m) {
        if (br) issue(iss, n, "ERROR", "DG003", `ветка внутри ветки (открыта в строке ${brLine}) — закройте «конец» или разделите процесс`);
        else if (!m[1].trim()) issue(iss, n, "ERROR", "DG003", "«если» без условия");
        else { br = "если: " + m[1].trim(); brLine = n; groupN = 0 }
        return;
      }
      m = ln.match(ELSE_RE);
      if (m) {
        if (!br) issue(iss, n, "ERROR", "DG003", "«иначе» без «если»");
        else {
          if (groupN === 0) issue(iss, n, "ERROR", "DG006", `ветка «${br}» без шагов`);
          br = "иначе: " + (m[1].trim() || "в остальных случаях"); brLine = n; groupN = 0;
        }
        return;
      }
      if (END_RE.test(ln)) {
        if (!br) issue(iss, n, "ERROR", "DG003", "«конец» без «если»");
        else { if (groupN === 0) issue(iss, n, "ERROR", "DG006", `ветка «${br}» без шагов`); br = ""; groupN = 0 }
        return;
      }
      m = ln.match(MSG_RE);
      if (m) {
        const src = m[1], arrow = m[2], dst = m[3], text = m[4].trim();
        const bad = [...new Set([src, dst])].filter(x => !has(parts, x) && !has(local, x));
        bad.forEach(x => issue(iss, n, "ERROR", "DG007", `участника ${x} нет — ID из «Участников» или объявление «система ${x}: Имя»`));
        if (!text) issue(iss, n, "ERROR", "DG005", "пустое сообщение после «:»");
        if (bad.length || !text) return;
        if (len(text) > MAX_MSG) issue(iss, n, "WARN", "DG022", `сообщение ${len(text)} знаков (больше ${MAX_MSG})`);
        const kind = arrow === "-->" ? "ответ" : "вызов";
        if (kind === "ответ" && src !== dst && !steps.some(s => s.src === dst && s.dst === src && s.kind === "вызов"))
          issue(iss, n, "WARN", "DG024", `ответ ${src} --> ${dst} без вызова ${dst} -> ${src} — вызов «->», ответ «-->»`);
        steps.push({ branch: br, src, dst, text, kind, line: n }); groupN++;
        return;
      }
      if (NOMSG_RE.test(ln)) { issue(iss, n, "ERROR", "DG005", "нет сообщения — «A -> B: что передаётся»"); return }
      issue(iss, n, "ERROR", "DG001", "строка не разобрана: «A -> B: сообщение», «B --> A: ответ», «если …», «иначе …», «конец», «описание: …» или «система ID: Имя»");
    });
    if (br) issue(iss, last || 1, "ERROR", "DG003", `ветка из строки ${brLine} не закрыта — «конец»`);
    if (!steps.length) issue(iss, last || 1, "ERROR", "DG008", "нет ни одного шага «A -> B: сообщение»");
    const used = [...new Set(steps.flatMap(s => [s.src, s.dst]))];
    Object.keys(declLine).forEach(pid => { if (!used.includes(pid)) issue(iss, declLine[pid], "WARN", "DG023", `участник ${pid} объявлен, но не участвует в шагах`) });
    if (steps.length > MAX_STEPS) issue(iss, steps[MAX_STEPS].line, "WARN", "DG020", `${steps.length} шагов (больше ${MAX_STEPS}) — схема перестаёт читаться, раздели процесс`);
    if (used.length > MAX_PARTS) issue(iss, 1, "WARN", "DG021", `${used.length} участников (больше ${MAX_PARTS}) — раздели процесс`);
    if (steps.length && !desc) issue(iss, 1, "WARN", "DG025", "нет «описание: …» — суть процесса одной-двумя фразами");
    return { kind: "seq", desc, parts: local, steps, issues: sortIssues(iss) };
  }

  /* ---------- idef0 ---------- */
  const box = line => ({ in: [], ctl: [], out: [], mech: [], line, keys: {} });
  function parseIdef(body) {
    const iss = [], top = box(1), kids = [];
    let fn = "", fnLine = 0, cur = top;
    body.forEach((raw, idx) => {
      const n = idx + 1, ln = raw.trim();
      if (!ln || ln.startsWith("//")) return;
      let m = ln.match(KEY_RE);
      if (m) {
        const key = KEY_OF[m[1]];
        if (key === "fn") {
          if (cur !== top || fnLine) issue(iss, n, "ERROR", "DG031", "«функция:» — одна, до функций A1…An");
          else { fn = m[2].trim(); fnLine = n }
          return;
        }
        if (cur.keys[key]) { issue(iss, n, "ERROR", "DG031", `«${KEY_NAME[key]}» уже есть (строка ${cur.keys[key]}) — значения через «;» в одной строке`); return }
        cur.keys[key] = n; cur[key] = splitValues(m[2]);
        cur[key].forEach(v => { if (len(v) > MAX_LABEL) issue(iss, n, "WARN", "DG042", `подпись ${len(v)} знаков (больше ${MAX_LABEL}): «${[...v].slice(0, 30).join("")}…»`) });
        return;
      }
      m = ln.match(FN_RE);
      if (m) {
        const k = parseInt(m[1], 10), name = m[2].trim();
        if (k !== kids.length + 1) issue(iss, n, "ERROR", "DG033", `функция A${k}: номера по порядку — ожидается A${kids.length + 1}`);
        if (!name) issue(iss, n, "ERROR", "DG033", `функция A${k} без названия`);
        cur = box(n); cur.n = k; cur.i = kids.length; cur.name = name; kids.push(cur);
        return;
      }
      issue(iss, n, "ERROR", "DG030", "строка не разобрана: «вход: …», «управление: …», «выход: …», «механизм: …», «функция: …» или «A1 Название функции»");
    });
    ["in", "ctl", "out", "mech"].forEach(key => { if (!top[key].length) issue(iss, top.keys[key] || 1, "ERROR", "DG032", `пустое поле «${KEY_NAME[key]}» блока`) });
    if (kids.length && !(MIN_FN <= kids.length && kids.length <= MAX_FN)) issue(iss, kids[0].line, "ERROR", "DG033", `функций ${kids.length} — декомпозиция от ${MIN_FN} до ${MAX_FN}`);
    if (kids.length) {
      const boundary = new Set([...top.in, ...top.ctl].map(normLabel)), made = {}, mechs = new Set(top.mech.map(normLabel));
      kids.forEach(b => b.out.forEach(v => { const l = normLabel(v); if (!(l in made)) made[l] = b.i }));
      kids.forEach(b => {
        ["ctl", "out"].forEach(key => { if (!b[key].length) issue(iss, b.line, "ERROR", "DG034", `у A${b.n} нет «${KEY_NAME[key]}» — в IDEF0 у каждой функции есть управление и выход`) });
        ["in", "ctl"].forEach(key => b[key].forEach(v => {
          const l = normLabel(v);
          if (!boundary.has(l) && (!(l in made) || made[l] === b.i))
            issue(iss, b.keys[key], "ERROR", "DG035", `«${v}» у A${b.n} ниоткуда не приходит — это вход или управление блока либо выход другой функции`);
        }));
        b.mech.forEach(v => { if (!mechs.has(normLabel(v))) issue(iss, b.keys.mech, "WARN", "DG041", `механизм «${v}» у A${b.n} — не из механизмов блока`) });
      });
      const topOut = new Set(top.out.map(normLabel));
      top.out.forEach(v => { if (!(normLabel(v) in made)) issue(iss, top.keys.out || 1, "ERROR", "DG036", `выход блока «${v}» не выдаёт ни одна функция`) });
      const consumed = new Set(kids.flatMap(b => [...b.in, ...b.ctl]).map(normLabel));
      kids.forEach(b => b.out.forEach(v => { const l = normLabel(v); if (!topOut.has(l) && !consumed.has(l)) issue(iss, b.keys.out, "WARN", "DG040", `выход «${v}» у A${b.n} никуда не идёт`) }));
    }
    const clean = b => ({ in: b.in, ctl: b.ctl, out: b.out, mech: b.mech });
    return { kind: "idef0", fn, ...clean(top), children: kids.map(b => ({ n: b.n, name: b.name, ...clean(b), line: b.line })), issues: sortIssues(iss) };
  }

  function checkText(text, parts) {
    const ex = extract(text);
    if (!ex.kind) return { kind: "", id: "", issues: ex.issues };
    const res = ex.kind === "seq" ? parseSeq(ex.body, parts || {}) : parseIdef(ex.body);
    res.id = ex.id; res.issues = sortIssues([...ex.issues, ...res.issues]);
    return res;
  }

  /* ---------- шпаргалка грамматики — для промпта ИИ (полная — resources/diagram_dsl.md) ---------- */
  const GRAMMAR = {
    seq: `Блок \`\`\`seq <ID процесса> … \`\`\`, по строке на шаг:
описание: суть процесса одной-двумя фразами (до ${MAX_DESC} знаков)
A -> B: что передаётся        — вызов (сплошная стрелка)
B --> A: что вернулось        — ответ на вызов A -> B (пунктир)
A -> A: проверка внутри A     — шаг внутри участника
если <условие> … иначе <условие> … конец — развилка из БФТ, без вложенных веток
система ID: Имя (или человек / интерфейс / внешний) — новый участник; ID — латиница до 8 знаков
// комментарий
До ${MAX_STEPS} шагов и ${MAX_PARTS} участников, сообщение до ${MAX_MSG} знаков. Неизвестное — [УТОЧНИТЬ у <кого>].`,
    idef0: `Блок \`\`\`idef0 <ID задачи> … \`\`\`:
функция: название (по умолчанию — текст задачи)
вход: что преобразуется; через «;»
управление: правила и ограничения с ID требований
выход: результат
механизм: кто и чем исполняет
A1 Название функции        — декомпозиция: от ${MIN_FN} до ${MAX_FN} функций, номера по порядку
  вход: …                  — вход или управление блока либо выход другой функции, подписи совпадают дословно
  управление: …            — обязательно у каждой функции
  выход: …                 — обязательно; каждый выход блока выдаёт какая-то функция
  механизм: …              — из механизмов блока
Подпись до ${MAX_LABEL} знаков. Неизвестное — [УТОЧНИТЬ у <кого>].`
  };

  /* ---------- источник блока по модели (для редактора и «Скопировать блок») ---------- */
  const KIND_WORD = { p: "человек", i: "интерфейс", s: "система", x: "внешний" };
  function seqSource(id, m) {
    const out = ["```seq " + id];
    if (m.desc) out.push("описание: " + m.desc);
    Object.keys(m.parts || {}).forEach(k => out.push(`${KIND_WORD[m.parts[k][1]]} ${k}: ${m.parts[k][0]}`));
    let cur = "";
    m.steps.forEach(s => {
      if (s.branch !== cur) {
        if (cur && !s.branch) out.push("конец");
        if (s.branch) out.push(s.branch.replace(/^(если|иначе):\s*/, "$1 "));
        cur = s.branch;
      }
      out.push(`${cur ? "  " : ""}${s.src} ${s.kind === "ответ" ? "-->" : "->"} ${s.dst}: ${s.text}`);
    });
    if (cur) out.push("конец");
    return out.concat("```").join("\n");
  }
  function idefSource(id, m) {
    const kv = (k, v, pad) => v.length ? [`${pad}${k}: ${v.join("; ")}`] : [];
    const out = ["```idef0 " + id];
    if (m.fn) out.push("функция: " + m.fn);
    out.push(...kv("вход", m.in, ""), ...kv("управление", m.ctl, ""), ...kv("выход", m.out, ""), ...kv("механизм", m.mech, ""));
    (m.children || []).forEach(c => { out.push("", `A${c.n} ${c.name}`, ...kv("вход", c.in, "  "), ...kv("управление", c.ctl, "  "), ...kv("выход", c.out, "  "), ...kv("механизм", c.mech, "  ")) });
    return out.concat("```").join("\n");
  }

  /* ---------- рисунки ---------- */
  const MARK = "[УТОЧНИТЬ", U = t => String(t || "").includes(MARK);
  const esc = s => BPK.esc(s), wrapT = (t, n) => BPK.wrapT(t, n);
  const tsp = (ls, x, dy) => ls.map((l, i) => `<tspan x="${x}" dy="${i ? dy : 0}">${esc(l)}</tspan>`).join("");
  const halo = 'paint-order="stroke" stroke="#faf9f6" stroke-width="4" stroke-linejoin="round"';
  const partOf = (k, parts, m) => (m.parts && m.parts[k]) || parts[k] || [k, "s"];
  const hiddenKind = (k, parts, m) => "sx".includes(partOf(k, parts, m)[1]);
  function hiddenSteps(m, parts) { return m.steps.map((s, i) => [i + 1, s]).filter(([, s]) => hiddenKind(s.src, parts, m) || hiddenKind(s.dst, parts, m)) }

  /* sequence: люди и интерфейсы слева, системы — справа от линии видимости */
  function seqSVG(m, parts, uid) {
    const order = { p: 0, i: 1, s: 2, x: 3 }, info = k => partOf(k, parts, m), hk = k => "sx".includes(info(k)[1]);
    const mk = "sq" + (uid || "");
    const P = [...new Set(m.steps.flatMap(s => [s.src, s.dst]))].sort((a, b) => order[info(a)[1]] - order[info(b)[1]]);
    const CW = 150, X0 = 20, cx = k => X0 + CW * P.indexOf(k) + CW / 2;
    const W = Math.max(X0 * 2 + CW * P.length, ...m.steps.filter(s => s.src === s.dst).map(s => cx(s.src) + 40 + len(s.text) * 6.3 + X0));
    const rows = []; let cur = "";
    m.steps.forEach(s => { const br = s.branch || ""; if (br !== cur) { if (cur.startsWith("если") && !br.startsWith("иначе")) rows.push({ end: 1 }); if (cur.startsWith("иначе")) rows.push({ end: 1 }); if (br) rows.push({ br }); cur = br } rows.push({ s }) });
    if (cur) rows.push({ end: 1 });
    const H = 70 + rows.reduce((a, r) => a + (r.s ? (r.s.src === r.s.dst ? 40 : 34) : r.br ? 24 : 8), 0) + 16;
    const vis = P.findIndex(hk);
    let s = `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px;max-width:100%" role="img" aria-label="Как устроен процесс"><defs><marker id="${mk}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#3a3a3a"/></marker></defs>`;
    if (vis > 0) { const xv = X0 + CW * vis; s += `<rect x="${xv}" y="0" width="${W - xv}" height="${H}" fill="#f1f3f7"/><line x1="${xv}" y1="0" x2="${xv}" y2="${H}" stroke="#7d7a73" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${xv + 6}" y="${H - 6}" font-size="10.5" fill="#7d7a73">за линией видимости — скрыто от гостя</text>` }
    P.forEach(k => {
      const x = cx(k), [n, t] = info(k);
      s += `<line x1="${x}" y1="44" x2="${x}" y2="${H - 20}" stroke="#c9c4ba" stroke-dasharray="3 4"/>`;
      s += t === "p" ? `<circle cx="${x}" cy="14" r="7" fill="none" stroke="#1c1c1c" stroke-width="1.5"/><path d="M${x - 11},34 q11,-14 22,0" fill="none" stroke="#1c1c1c" stroke-width="1.5"/><text x="${x}" y="46" font-size="12" font-weight="700" text-anchor="middle">${esc(n)}</text>`
        : `<rect x="${x - 64}" y="8" width="128" height="30" rx="7" fill="${t === "i" ? "#e5f3f4" : t === "x" ? "#f3f1ec" : "#e7edf8"}" stroke="${t === "i" ? "#0f8b8d" : t === "x" ? "#9a958c" : "#2563c9"}" stroke-width="1.2"/><text x="${x}" y="27" font-size="11.5" font-weight="700" text-anchor="middle">${esc(len(n) > 20 ? [...n].slice(0, 19).join("") + "…" : n)}</text>`;
    });
    let y = 70, num = 0, top = 0; const xs = P.map(cx), L = Math.min(...xs) - 50, Rr = Math.max(...xs) + 50;
    rows.forEach(r => {
      if (r.br) { if (r.br.startsWith("если")) top = y; else s += `<line x1="${L}" y1="${y + 2}" x2="${Rr}" y2="${y + 2}" stroke="#9a958c" stroke-dasharray="5 4"/>`; s += `<text x="${L + 6}" y="${y + 16}" font-size="10.5" font-weight="800" fill="#6b6b6b">${esc(r.br.replace(/^если:\s*/, "ЕСЛИ ").replace(/^иначе:\s*/, "ИНАЧЕ "))}</text>`; y += 24; return }
      if (r.end) { s += `<rect x="${L}" y="${top}" width="${Rr - L}" height="${y - top + 4}" rx="6" fill="none" stroke="#9a958c"/>`; y += 8; return }
      const st = r.s; num++; const xa = cx(st.src), xb = cx(st.dst), hid = hk(st.src) || hk(st.dst), col = hid ? "#2563c9" : "#1c1c1c", red = U(st.text);
      const badge = x => `<circle cx="${x}" cy="${y}" r="8" fill="${hid ? "#2563c9" : "#2f6b2a"}"/><text x="${x}" y="${y + 3.5}" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle">${num}</text>`;
      if (st.src === st.dst) { s += `<path d="M${xa},${y} h28 v16 h-26" fill="none" stroke="${col}" stroke-width="1.4" marker-end="url(#${mk})"/><text x="${xa + 34}" y="${y + 12}" font-size="11.5" fill="${red ? "#c0392b" : col}">${esc(st.text)}</text>` + badge(xa - 12); y += 40; return }
      const dir = xb > xa ? 1 : -1;
      s += `<line x1="${xa}" y1="${y}" x2="${xb - dir * 2}" y2="${y}" stroke="${col}" stroke-width="1.4" ${st.kind === "ответ" ? 'stroke-dasharray="5 4"' : ""} marker-end="url(#${mk})"/><text x="${(xa + xb) / 2}" y="${y - 6}" font-size="11.5" text-anchor="middle" fill="${red ? "#c0392b" : col}">${esc(st.text)}</text>` + badge(xa + dir * 14);
      y += 34;
    });
    return s + "</svg>";
  }

  /* IDEF0 A0: вход слева, выход справа, управление сверху, механизмы снизу */
  function idefSVG(m, o) {
    const bh = Math.max(130, 58 * Math.max(m.in.length, m.out.length)), W = 560, H = 340 + bh, bx = 195, by = 170, bw = 170, col = o.color, mk = "ia" + (o.uid || "");
    const red = x => U(x) ? "#c0392b" : "#1c1c1c";
    let s = `<svg class="idef" viewBox="0 0 ${W} ${H}" role="img" aria-label="IDEF0"><defs><marker id="${mk}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1c1c1c"/></marker></defs><rect x="0" y="0" width="${W}" height="${H}" rx="10" fill="#faf9f6"/>`;
    const cap = (x, y, txt, a) => `<text x="${x}" y="${y}" font-size="11" font-weight="700" fill="#6b6b6b" letter-spacing=".6" text-anchor="${a}">${txt}</text>`;
    s += cap(8, by - 14, "ВХОД", "start") + cap(W - 8, by - 14, "ВЫХОД", "end") + cap(W / 2, 14, "УПРАВЛЕНИЕ — правила и ограничения", "middle") + cap(W / 2, H - 6, "МЕХАНИЗМЫ — кто и чем исполняет", "middle");
    s += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="3" fill="#fff" stroke="${col}" stroke-width="2.2" ${o.dashed ? 'stroke-dasharray="6 3"' : ""}/><rect x="${bx}" y="${by}" width="${bw}" height="6" fill="${col}"/>`;
    const fl = wrapT(m.fn || o.title, 18).slice(0, 5); s += `<text x="${bx + bw / 2}" y="${by + bh / 2 - (fl.length - 1) * 8 + 4}" font-size="13.5" font-weight="700" text-anchor="middle">${tsp(fl, bx + bw / 2, 16)}</text><text x="${bx + bw - 6}" y="${by + bh - 6}" font-size="11" fill="#6b6b6b" text-anchor="end">A0</text>`;
    m.in.forEach((v, i) => { const y = by + bh * (i + 1) / (m.in.length + 1), ls = wrapT(v, 22).slice(0, 3); s += `<path d="M8,${y} H${bx}" stroke="#1c1c1c" stroke-width="1.6" marker-end="url(#${mk})"/><text x="8" y="${y - 6 - (ls.length - 1) * 15}" font-size="13" fill="${red(v)}">${tsp(ls, 8, 15)}</text>` });
    m.out.forEach((v, i) => { const y = by + bh * (i + 1) / (m.out.length + 1), ls = wrapT(v, 22).slice(0, 3); s += `<path d="M${bx + bw},${y} H${W - 8}" stroke="#1c1c1c" stroke-width="1.6" marker-end="url(#${mk})"/><text x="${bx + bw + 8}" y="${y - 6 - (ls.length - 1) * 15}" font-size="13" fill="${red(v)}">${tsp(ls, bx + bw + 8, 15)}</text>` });
    const sideTxt = (arr, topSide) => { const k = arr.length, sl = W / k; arr.forEach((v, i) => { const ax = bx + bw * (i + 1) / (k + 1), tx = sl * i + sl / 2, ls = wrapT(v, Math.max(14, Math.floor(sl / 7.6))).slice(0, 4);
      s += topSide ? `<path d="M${tx},102 L${tx},116 L${ax},136 L${ax},${by}" fill="none" stroke="#1c1c1c" stroke-width="1.6" marker-end="url(#${mk})"/><text x="${tx}" y="34" font-size="13" text-anchor="middle" fill="${red(v)}">${tsp(ls, tx, 15)}</text>`
        : `<path d="M${tx},${H - 76} L${tx},${H - 90} L${ax},${by + bh + 26} L${ax},${by + bh}" fill="none" stroke="#1c1c1c" stroke-width="1.6" marker-end="url(#${mk})"/><text x="${tx}" y="${H - 58}" font-size="13" text-anchor="middle" fill="${red(v)}">${tsp(ls, tx, 15)}</text>` }) };
    sideTxt(m.ctl, true); sideTxt(m.mech, false);
    return s + "</svg>";
  }

  /* IDEF0 декомпозиция: функции лесенкой; стрелки между ними — по совпадению подписей выхода и входа */
  function idefDecompSVG(m, o) {
    const K = m.children, n = K.length, bw = 132, gx = 112, gy = 40, mk = "ib" + (o.uid || "");
    const bh = Math.max(70, 42 * Math.max(...K.map(b => Math.max(b.in.length, b.out.length))) + 6);
    const ML = 136, MR = 136, ctlMax = Math.max(...K.map(b => b.ctl.length), 1), mechMax = Math.max(...K.map(b => b.mech.length), 1);
    const MT = 30 + ctlMax * 32, MB = 30 + mechMax * 32;
    const W = ML + n * bw + (n - 1) * gx + MR, H = MT + n * bh + (n - 1) * gy + MB;
    const bx = i => ML + i * (bw + gx), by = i => MT + i * (bh + gy);
    const boundary = new Set([...m.in, ...m.ctl].map(normLabel)), topOut = new Set(m.out.map(normLabel)), made = {};
    K.forEach((b, i) => b.out.forEach(v => { const l = normLabel(v); if (!(l in made)) made[l] = i }));
    const red = x => U(x) ? "#c0392b" : "#1c1c1c";
    const port = (a, b, k, cnt) => a + (b - a) * (k + 1) / (cnt + 1);
    let lines = "", labels = "";
    const arrow = (d, dash) => lines += `<path d="${d}" fill="none" stroke="#1c1c1c" stroke-width="1.5" ${dash ? 'stroke-dasharray="5 3"' : ""} marker-end="url(#${mk})"/>`;
    /* подпись над точкой (y — нижняя строка) или под ней (down: y — верхняя строка); возвращает число строк */
    const label = (x, y, v, a, wmax, down) => { const ls = wrapT(v, wmax).slice(0, 2); labels += `<text x="${x}" y="${down ? y : y - (ls.length - 1) * 13}" font-size="11.5" text-anchor="${a}" fill="${red(v)}" ${halo}>${tsp(ls, x, 13)}</text>`; return ls.length };
    const outY = (i, v) => { const b = K[i], k = b.out.findIndex(x => normLabel(x) === normLabel(v)); return port(by(i), by(i) + bh, k, b.out.length) };
    const chan = {}; const nextChan = j => (chan[j] = (chan[j] || 0) + 1) - 1;
    let fb = 0;
    K.forEach((b, j) => {
      b.in.forEach((v, k) => {
        const y = port(by(j), by(j) + bh, k, b.in.length), l = normLabel(v), src = boundary.has(l) ? -1 : made[l];
        if (src === -1 || src === undefined) { arrow(`M8,${y} H${bx(j)}`); label(10, y - 5, v, "start", 18); return }
        const sy = outY(src, v), sx = bx(src) + bw;
        if (src < j) { const cx = bx(j) - 18 - 9 * nextChan(j); arrow(`M${sx},${sy} H${cx} V${y} H${bx(j)}`); label(sx + 5, sy - 5, v, "start", 14) }
        else { const ox = sx + 16 + 9 * fb, oy = by(j) - 14 - 7 * fb++; arrow(`M${sx},${sy} H${ox} V${oy} H${bx(j) - 22} V${y} H${bx(j)}`, true); label(sx + 5, sy - 5, v, "start", 14) }
      });
      b.ctl.forEach((v, k) => {
        const x = port(bx(j), bx(j) + bw, k, b.ctl.length), l = normLabel(v), src = boundary.has(l) ? -1 : made[l];
        if (src === -1 || src === undefined) { const ty = 16 + k * 32, nl = label(x, ty, v, "middle", 20, true); arrow(`M${x},${ty + nl * 13 - 6} V${by(j)}`); return }
        const sy = outY(src, v), sx = bx(src) + bw;
        if (src < j) { arrow(`M${sx},${sy} H${x} V${by(j)}`); label(sx + 5, sy - 5, v, "start", 14) }
        else { const ox = sx + 16 + 9 * fb, oy = by(j) - 14 - 7 * fb++; arrow(`M${sx},${sy} H${ox} V${oy} H${x} V${by(j)}`, true); label(sx + 5, sy - 5, v, "start", 14) }
      });
      b.mech.forEach((v, k) => { const x = port(bx(j), bx(j) + bw, k, b.mech.length), ty = H - 12 - k * 32, nl = label(x, ty, v, "middle", 20); arrow(`M${x},${ty - 13 * nl} V${by(j) + bh}`) });
      b.out.forEach(v => { if (topOut.has(normLabel(v))) { const y = outY(j, v); arrow(`M${bx(j) + bw},${y} H${W - 8}`); label(W - 10, y - 5, v, "end", 20) } });
    });
    let boxes = "";
    K.forEach((b, i) => {
      const x = bx(i), y = by(i), fl = wrapT(b.name, 16).slice(0, 3);
      boxes += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="#fff" stroke="${o.color}" stroke-width="2"/><rect x="${x}" y="${y}" width="${bw}" height="5" fill="${o.color}"/>`;
      boxes += `<text x="${x + bw / 2}" y="${y + bh / 2 - (fl.length - 1) * 7.5 + 3}" font-size="12.5" font-weight="700" text-anchor="middle" fill="${red(b.name)}">${tsp(fl, x + bw / 2, 15)}</text><text x="${x + bw - 5}" y="${y + bh - 5}" font-size="10.5" fill="#6b6b6b" text-anchor="end">A${b.n}</text>`;
    });
    return `<svg class="idef dec" viewBox="0 0 ${W} ${H}" style="width:${W}px" role="img" aria-label="IDEF0 — декомпозиция"><defs><marker id="${mk}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1c1c1c"/></marker></defs><rect x="0" y="0" width="${W}" height="${H}" rx="10" fill="#faf9f6"/>${lines}${boxes}${labels}</svg>`;
  }

  return { GRAMMAR, extract, parseSeq, parseIdef, checkText, splitValues, normLabel, seqSource, idefSource, seqSVG, idefSVG, idefDecompSVG, hiddenSteps, MAX_STEPS };
})();
</script>
<script>
/* bft-blueprint · карта инициативы. Данные — #map-data (собирает bft-map-render.py).
   Три слоя чтения: «Что видят» (история), «Что делаем» (задачи команд), «Как это работает»
   (Frontstage, Backstage, Support). Подробности — по клику, в боковой панели. */
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("map-data").textContent);
  const { esc, wrapT, chip, mockSVG } = BPK;
  const body = document.body, grid = document.getElementById("grid");
  const MARK = "[УТОЧНИТЬ";
  const U = t => String(t || "").includes(MARK);

  /* ---------- справочники ---------- */
  const COLS = [...D.stages, { id: "стало", name: "Итог", when: "" }];
  const colOf = st => COLS.findIndex(c => c.id === st);
  const TEAM = {}; D.teams.forEach((t, i) => TEAM[t.id] = { name: t.name, c: `var(--t${i % 10})` });
  const teamC = t => t.team === "?" ? "var(--red)" : TEAM[t.team].c;
  const teamN = t => t.team === "?" ? "Команда?" : TEAM[t.team].name;
  const TASK = {}; D.tasks.forEach(t => TASK[t.id] = t);
  const PROC = {}; D.processes.forEach(p => PROC[p.id] = p);
  const qOf = where => D.questions.filter(q => q.where === where && q.open);
  const asks = id => qOf(id).filter(q => q.kind === "вопрос").length;
  const blocks = id => qOf(id).filter(q => q.kind === "блокер");
  const scrOpen = id => D.storyQuestions.some(q => q.where === id);
  const LAYER = { front: ["Frontstage", "видит гость", "#0f8b8d"], back: ["Backstage", "за кадром", "#2563c9"], sup: ["Support", "основа", "#6b5fb0"] };
  const PERSONA_ICON = ['<circle cx="8" cy="5.5" r="2.6"/><path d="M3 14c.6-3 2.6-4.5 5-4.5s4.4 1.5 5 4.5"/>', '<path d="M4 2v5a2 2 0 0 0 2 2v5M6 2v4M8 2v5a2 2 0 0 1-2 2M12 14V2c-1.5 1-2.5 3-2.5 5.5H12"/>'];
  const who = p => `<span class="who"><svg viewBox="0 0 16 16">${PERSONA_ICON[Math.min(1, D.personas.findIndex(x => x.id === p.id))]}</svg>${esc(p.name)}</span>`;
  const mock = (id, w) => `<span class="scrw" style="position:relative;display:block${w ? `;width:${w}px` : ""}">${scrOpen(id) ? '<span class="dot" style="top:-4px;right:-5px"></span>' : ""}${mockSVG(D.screens[id], D.screens[id].contour)}</span>`;

  /* ---------- шапка ---------- */
  const uniqBlk = [...new Set(D.questions.filter(q => q.open && q.kind === "блокер").map(q => q.text))];
  document.getElementById("blk").innerHTML = uniqBlk.length ? `<button class="mi blk" data-guide="blk"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M3.5 12.5l9-9"/></svg>Блокеры<b class="cnt">${uniqBlk.length}</b></button>` : "";
  const used = {}; D.tasks.forEach(t => used[t.team] = (used[t.team] || 0) + 1);
  const nTasks = n => `${n} ${n % 10 === 1 && n % 100 !== 11 ? "задача" : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? "задачи" : "задач"}`;
  document.getElementById("teams").innerHTML = D.teams.filter(t => used[t.id]).map(t => `<button class="tchip" data-tf="${t.id}" style="--c:${TEAM[t.id].c}"><i></i>${esc(t.name)}<b>${nTasks(used[t.id])}</b></button>`).join("") +
    (used["?"] ? `<button class="tchip" data-tf="?" style="--c:var(--red)"><i class="u"></i>Команда не определена<b>${nTasks(used["?"])}</b></button>` : "");
  if (uniqBlk.length) document.getElementById("bdot").textContent = uniqBlk.length;

  /* ---------- меню: всё, что раньше было в шапке, — поверх карты ---------- */
  const burger = document.getElementById("burger");
  const menu = open => { body.classList.toggle("mopen", open); burger.setAttribute("aria-expanded", open); if (open) document.querySelector("#menu .play").focus() };
  /* фильтр по команде: подсветить её работу, на кнопке меню — чип с крестиком */
  function teamFilter(id) {
    document.querySelectorAll(".tchip").forEach(x => x.classList.toggle("on", x.dataset.tf === id));
    document.querySelectorAll(".wk,.hw").forEach(x => x.classList.toggle("dim", !!id && x.dataset.team !== id));
    const t = id && (id === "?" ? { name: "Команда не определена", c: "var(--red)" } : TEAM[id]);
    document.getElementById("fchip").innerHTML = t ? `<button class="fchip" data-tf-clear style="--c:${t.c}" aria-label="Снять фильтр"><i></i>${esc(t.name)}<span aria-hidden="true">×</span></button>` : "";
  }

  /* ---------- карточки ---------- */
  /* карточка «что видят» для ленты телефона: экран, персонаж, заголовок, две строки текста */
  const plural = (n, a, b, c) => n % 10 === 1 && n % 100 !== 11 ? a : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? b : c;
  function seenHTML(c) {
    return D.seen.filter(s => s.col === c).map(s => {
      const p = D.personas.find(x => x.id === s.persona), w = who(p);
      if (s.final) return `<div class="seen fin" data-seen="${s.key}" role="button" tabindex="0">${w}${s.big ? `<b class="big">${esc(s.big)}</b>` : ""}<b>${esc(s.title)}</b></div>`;
      const more = s.steps.length - 1;
      return `<div class="seen" data-seen="${s.key}" role="button" tabindex="0"><span class="th">${mock(s.steps[0].screens[0])}</span><div class="sx">${w}<b>${esc(s.steps[0].title)}</b><p>${esc(s.steps[0].text)}</p>${more ? `<span class="more">+${more} ${plural(more, "шаг", "шага", "шагов")}</span>` : ""}</div></div>`;
    }).join("");
  }
  function taskHTML(t) {
    const b = blocks(t.id).length, a = asks(t.id);
    return `<button class="wk${b ? " blk" : ""}" data-task="${t.id}" data-team="${t.team}" style="--c:${teamC(t)}"><span class="tm${t.team === "?" ? " u" : ""}"><i></i>${esc(teamN(t))}${b ? '<span class="bl">Блокер</span>' : a ? `<span class="qn" title="Открытых вопросов: ${a}">${a}</span>` : ""}</span><span class="tx">${esc(t.text)}</span></button>`;
  }
  function procHTML(p) {
    const t = TASK[p.task], b = blocks(p.id).length + blocks(p.task).length;
    return `<button class="hw ${p.layer}${b ? " blk" : ""}" data-proc="${p.id}" data-team="${t.team}" style="--c:${teamC(t)}"><span>${esc(p.text)}</span><i title="${esc(teamN(t))}"></i></button>`;
  }

  /* ---------- холст ---------- */
  grid.className = "map";
  grid.style.gridTemplateColumns = `96px repeat(${COLS.length}, minmax(224px, 1fr))`;
  grid.style.minWidth = `${96 + COLS.length * 236}px`;
  let h = `<div class="mh corner"></div>` + COLS.map((c, i) => `<div class="mh"><span class="n">${i === COLS.length - 1 ? "✓" : i + 1}</span><span class="hx"><b>${esc(c.name)}</b>${c.when ? `<small>${esc(c.when)}</small>` : ""}</span></div>`).join("");
  h += `<div class="ml">Что делаем</div>` + COLS.map((col, c) => `<div class="mc">${D.tasks.filter(t => t.stage === col.id).map(taskHTML).join("")}</div>`).join("");
  if (D.processes.length) {
    h += `<div class="hsec"><span>Как это работает</span></div>`;
    ["front", "back", "sup"].filter(l => D.processes.some(p => p.layer === l)).forEach(l => {
      h += `<div class="ml hrow l-${l}">${LAYER[l][0]}<small>${LAYER[l][1]}</small></div>` + COLS.map(col => `<div class="mc how l-${l}">${D.processes.filter(p => p.layer === l && p.stage === col.id).map(procHTML).join("")}</div>`).join("");
    });
  }
  grid.innerHTML = h;

  /* стрелки между процессами — из «Цепочки» */
  function drawLinks() {
    grid.querySelector("svg.hwl")?.remove();
    const g = grid.getBoundingClientRect();
    const R = el => { const r = el.getBoundingClientRect(); return { l: r.left - g.left, r: r.right - g.left, t: r.top - g.top, b: r.bottom - g.top, cx: (r.left + r.right) / 2 - g.left, cy: (r.top + r.bottom) / 2 - g.top } };
    let s = `<svg class="hwl" width="${grid.scrollWidth}" height="${grid.scrollHeight}"><defs><marker id="mh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8c877d"/></marker></defs>`;
    const path = pts => `<path d="M${pts.map(p => p.map(Math.round).join(",")).join(" L")}" fill="none" stroke="#8c877d" stroke-width="1.5" marker-end="url(#mh)"/>`;
    const seen = new Set();
    D.links.forEach(l => {
      if (!PROC[l.src] || !PROC[l.dst]) return;
      // на карте — только соседние шаги; полная цепочка живёт в карточке процесса
      if (Math.abs(colOf(PROC[l.src].stage) - colOf(PROC[l.dst].stage)) > 1) return;
      const key = [l.src, l.dst].sort().join(); if (seen.has(key)) return; seen.add(key);
      const ea = grid.querySelector(`[data-proc="${l.src}"]`), eb = grid.querySelector(`[data-proc="${l.dst}"]`); if (!ea || !eb) return;
      const A = R(ea), B = R(eb);
      if (Math.abs(A.cx - B.cx) < 40) s += B.t > A.b ? path([[A.cx, A.b], [A.cx, B.t]]) : path([[A.cx, A.t], [A.cx, B.b]]);
      else if (B.l > A.r) s += Math.abs(A.cy - B.cy) < 3 ? path([[A.r, A.cy], [B.l, B.cy]]) : path([[A.r, A.cy], [B.l - 12, A.cy], [B.l - 12, B.cy], [B.l, B.cy]]);
      else if (A.l > B.r) s += path([[A.l, A.cy], [B.r + 12, A.cy], [B.r + 12, B.cy], [B.r, B.cy]]);
    });
    grid.insertAdjacentHTML("beforeend", s + "</svg>");
  }
  window.addEventListener("load", drawLinks); window.addEventListener("resize", drawLinks);

  /* ---------- требования к экранам: screens/<ID>.md — вкладки и стек заметок ---------- */
  const IMG_MD = /^!\[(.*?)\]\((.+?)\)$/, SCR = {}, NOTE_OF = {};
  /* файл экрана: # заголовок, картинки до первой вкладки, ## вкладка, ### заметка, ниже — markdown */
  function parseNotes(text) {
    const doc = { title: "", images: [], tabs: [] }; let tab = null, note = null;
    text.split("\n").forEach(l => {
      let m;
      if (l.startsWith("### ")) { note = { title: l.slice(4).trim(), body: [] }; if (tab) tab.notes.push(note) }
      else if (l.startsWith("## ")) { tab = { name: l.slice(3).trim(), notes: [] }; doc.tabs.push(tab); note = null }
      else if (l.startsWith("# ")) doc.title = l.slice(2).trim();
      else if (note) note.body.push(l);
      else if (!tab && (m = l.trim().match(IMG_MD))) doc.images.push({ alt: m[1], src: m[2] });
    });
    doc.tabs.forEach(t => t.notes.forEach(n => n.md = n.body.join("\n").trim()));
    return doc;
  }
  Object.keys(D.notes || {}).forEach(id => { SCR[id] = parseNotes(D.notes[id]); NOTE_OF[id] = id; SCR[id].images.forEach(im => { const k = im.src.replace(/^screen:/, ""); if (im.src.startsWith("screen:") && !NOTE_OF[k]) NOTE_OF[k] = id }) });
  const imgSrc = s => s.startsWith("screen:") && D.screens[s.slice(7)] ? screenImg(s.slice(7)) : s;
  const mdInline = s => esc(s).replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/\[УТОЧНИТЬ у ([^\]]+)\]/g, '<mark>? $1</mark>');
  function mdHTML(text) {
    let k = -1;
    return text.split(/\n{2,}/).map(block => {
      const lines = block.split("\n"), im = block.trim().match(IMG_MD);
      if (im) { k++; return `<figure><img src="${esc(imgSrc(im[2]))}" alt="${esc(im[1])}" data-zoom="${k}"><figcaption>${esc(im[1])}</figcaption></figure>` }
      if (lines.every(l => /^\d+\.\s/.test(l))) return `<ol>${lines.map(l => `<li>${mdInline(l.replace(/^\d+\.\s+/, ""))}</li>`).join("")}</ol>`;
      if (lines.every(l => /^[-*] /.test(l))) return `<ul>${lines.map(l => `<li>${mdInline(l.slice(2))}</li>`).join("")}</ul>`;
      if (/^Источник:/.test(block)) return `<p class="snsrc">${mdInline(block)}</p>`;
      return `<p>${lines.map(mdInline).join("<br>")}</p>`;
    }).join("");
  }
  const notePreview = n => (n.md.split("\n").find(l => l.trim() && !IMG_MD.test(l.trim()) && !l.startsWith("Источник:")) || "").replace(/\*\*/g, "").replace(/\[УТОЧНИТЬ у ([^\]]+)\]/g, "? $1").replace(/^[-*] /, "");
  let snCur = null, snTab = 0, gallery = [];
  const snHead = (title, back) => `<div class="snbar">${back ? '<button class="snback" data-snback aria-label="Назад">←</button>' : ""}<h3>${esc(title)}</h3><button class="x" aria-label="Закрыть">×</button></div>`;
  function openScreen(id, tab) {
    snCur = NOTE_OF[id]; if (tab != null) snTab = tab; const d = SCR[snCur], t = d.tabs[snTab] || d.tabs[0];
    gallery = d.images.map(im => ({ alt: im.alt, src: imgSrc(im.src) }));
    side.innerHTML = snHead(d.title) + `<div class="snbody">${gallery.length ? `<div class="sngal${gallery.length > 1 ? " many" : ""}">${gallery.map((im, i) => `<img src="${esc(im.src)}" alt="${esc(im.alt)}" data-zoom="${i}">`).join("")}</div>` : ""}
      <nav class="snseg">${d.tabs.map((x, i) => `<button data-sntab="${i}"${x === t ? ' class="on"' : ""}>${esc(x.name)}</button>`).join("")}</nav>
      <ul class="snstack">${(t ? t.notes : []).map((n, i) => `<li data-snnote="${i}" tabindex="0"><b>${esc(n.title)}</b><span>${esc(notePreview(n))}</span>${n.md.includes(MARK) ? '<i class="q"></i>' : ""}</li>`).join("")}</ul></div>`;
    body.classList.remove("wide"); body.classList.add("open"); side.scrollTop = 0;
  }
  function openNote(i) {
    const d = SCR[snCur], n = d.tabs[snTab].notes[i];
    gallery = n.md.split(/\n{2,}/).map(b => b.trim().match(IMG_MD)).filter(Boolean).map(m => ({ alt: m[1], src: imgSrc(m[2]) }));
    side.innerHTML = snHead(n.title, true) + `<div class="snbody"><div class="snmd">${mdHTML(n.md)}</div></div>`; side.scrollTop = 0;
  }
  /* просмотр картинки: крупно, ‹ › если их несколько; Esc или клик мимо — закрыть */
  const LB = document.getElementById("lb"); let lbI = 0;
  function zoom(i) {
    lbI = (i + gallery.length) % gallery.length; const im = gallery[lbI], many = gallery.length > 1;
    LB.innerHTML = `<figure><img src="${esc(im.src)}" alt="${esc(im.alt)}"><figcaption>${esc(im.alt)}${many ? ` · ${lbI + 1} из ${gallery.length}` : ""}</figcaption></figure>${many ? '<button class="nv p" data-lb="-1" aria-label="Предыдущая">‹</button><button class="nv n" data-lb="1" aria-label="Следующая">›</button>' : ""}<button class="lx" aria-label="Закрыть">×</button>`;
    LB.hidden = false;
  }

  /* ---------- первый экран: «Что видят» раскадровкой, путь уходит вправо ----------
     Колонка — этап истории шириной во столько кадров, сколько шагов у самого занятого персонажа;
     ряд — персонаж; пустая клетка — персонаж на этапе не участвует. Кадр — экран картинкой
     и подпись; несколько экранов у шага — кадры листаются сами и стрелками. */
  const hero = document.getElementById("hero");
  /* экран — картинка: SVG-макет отдаётся в <img>, как отдался бы PNG из макетов */
  const IMG = {};
  const screenImg = id => IMG[id] || (IMG[id] = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(mockSVG(D.screens[id], D.screens[id].contour)
    .replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter,-apple-system,Helvetica,Arial,sans-serif" ')));
  (function buildHero() {
    const persons = D.personas.filter(p => D.seen.some(s => s.persona === p.id));
    const cell = (p, c) => D.seen.find(s => s.persona === p.id && s.col === c);
    const width = c => Math.max(1, ...persons.map(p => { const s = cell(p, c); return s ? s.steps.length : 0 }));
    const FW = 196, GAP = 18, PAD = 16;
    const frame = (s, st) => {
      const n = st.screens.length, q = st.screens.some(scrOpen) || D.storyQuestions.some(qq => qq.where === st.id);
      const pic = n ? `<span class="track">${st.screens.map(id => `<span class="sld"><img src="${screenImg(id)}" alt="${esc(D.screens[id].contour)}" draggable="false"></span>`).join("")}</span>
        ${n > 1 ? `<span class="sl prev" data-sl="-1" aria-hidden="true">‹</span><span class="sl next" data-sl="1" aria-hidden="true">›</span>` : ""}` : "";
      const dots = n > 1 ? `<span class="dots">${st.screens.map((_, i) => `<i data-dot="${i}"${i ? "" : ' class="on"'}></i>`).join("")}</span>` : "";
      const notes = st.screens.some(id => NOTE_OF[id]);
      return `<div class="fr" data-seen="${s.key}"${notes ? ` data-screens="${st.screens.join(",")}"` : ""} role="button" tabindex="0" title="${esc(st.text)}"><span class="pic" data-n="${n}" data-i="0">${pic}${q ? '<span class="dot"></span>' : ""}</span>${dots}<span class="cap">${esc(st.title)}</span></div>`;
    };
    let x = `<div class="hgrid" style="--p:${persons.length};grid-template-columns:var(--lw) ${COLS.map((_, c) => `${width(c) * FW + (width(c) - 1) * GAP + 2 * PAD}px`).join(" ")}">`;
    x += '<div class="hc0"></div>' + COLS.map((col, c) => `<div class="hh"><span class="hhs"><span class="n">${c === COLS.length - 1 ? "✓" : c + 1}</span><b>${esc(col.name)}</b>${col.when ? `<small>${esc(col.when)}</small>` : ""}</span></div>`).join("");
    persons.forEach((p, i) => {
      x += `<div class="hl"><svg viewBox="0 0 16 16" aria-hidden="true">${PERSONA_ICON[Math.min(1, i)]}</svg><b>${esc(p.name.split(/[\s-]+/)[0])}</b><small>${esc(p.name)}</small></div>`;
      COLS.forEach((_, c) => {
        const s = cell(p, c);
        if (!s) x += '<div class="hcell"></div>';
        else if (s.final) x += `<div class="hcell"><div class="fr fin" data-seen="${s.key}" role="button" tabindex="0"><span class="pic">${s.big ? `<span class="big">${esc(s.big)}</span>` : '<span class="big">✓</span>'}</span><span class="cap">${esc(s.title)}</span></div></div>`;
        else x += `<div class="hcell">${s.steps.map(st => frame(s, st)).join("")}</div>`;
      });
    });
    hero.innerHTML = `<div class="hscroll" id="hscroll">${x}</div></div><button class="hnav prev" aria-label="Назад по пути">‹</button><button class="hnav next" aria-label="Дальше по пути">›</button><a class="hdown" href="#work">Что делают команды и как это работает <span aria-hidden="true">↓</span></a>`;
    const sc = document.getElementById("hscroll"), prev = hero.querySelector(".prev"), next = hero.querySelector(".next");
    const sync = () => { prev.hidden = sc.scrollLeft < 8; next.hidden = sc.scrollLeft + sc.clientWidth > sc.scrollWidth - 8 };
    sc.addEventListener("scroll", sync, { passive: true }); window.addEventListener("resize", sync); sync();
    prev.addEventListener("click", () => sc.scrollBy({ left: -sc.clientWidth * .8, behavior: "smooth" }));
    next.addEventListener("click", () => sc.scrollBy({ left: sc.clientWidth * .8, behavior: "smooth" }));

    /* кадры внутри шага: сами листаются каждые 3 с, пока кадр на экране и под ним нет курсора */
    const multi = [...hero.querySelectorAll('.pic:not([data-n="0"]):not([data-n="1"])')].filter(el => el.dataset.n);
    const seen = new Set();
    if ("IntersectionObserver" in window) { const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? seen.add(e.target) : seen.delete(e.target)), { root: sc, threshold: .6 }); multi.forEach(el => io.observe(el)) }
    else multi.forEach(el => seen.add(el));
    const calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (multi.length && !calm) setInterval(() => seen.forEach(el => { if (!el.matches(":hover") && !body.classList.contains("open")) slide(el, 1) }), 3000);
  })();
  function slide(pic, d, to) {
    const n = +pic.dataset.n, i = to != null ? to : (+pic.dataset.i + d + n) % n;
    pic.dataset.i = i; pic.querySelector(".track").style.transform = `translateX(${-i * 100}%)`;
    pic.closest(".fr").querySelectorAll(".dots i").forEach((x, k) => x.classList.toggle("on", k === i));
  }

  /* ---------- телефон: шаг за шагом сверху вниз ---------- */
  document.getElementById("mstack").innerHTML = COLS.map((col, c) => {
    const tasks = D.tasks.filter(t => t.stage === col.id), procs = D.processes.filter(p => p.stage === col.id);
    return `<section class="ms"><div class="mh2"><span class="n">${c === COLS.length - 1 ? "✓" : c + 1}</span><div><b>${esc(col.name)}</b>${col.when ? `<small>${esc(col.when)}</small>` : ""}</div></div>
      <div class="wl">${seenHTML(c)}</div>${tasks.length ? `<span class="lb">Что делаем</span><div class="wl">${tasks.map(taskHTML).join("")}</div>` : ""}
      ${procs.length ? `<span class="lb">Как это работает</span><div class="wl">${procs.map(procHTML).join("")}</div>` : ""}</section>`;
  }).join("");

  /* ---------- боковая панель ---------- */
  const side = document.getElementById("side");
  function openSide(tag, color, title, meta, html, wide) {
    side.innerHTML = `<div class="stop"><span class="tag" style="--c:${color}">${esc(tag)}</span><h3>${esc(title)}</h3><div class="meta">${meta}</div><button class="x" aria-label="Закрыть">×</button></div><div class="sin">${html}</div>`;
    body.classList.toggle("wide", !!wide); body.classList.add("open"); side.scrollTop = 0;
  }
  const closeSide = () => body.classList.remove("open", "wide");
  const qHTML = list => list.length ? `<ul class="qlist">${list.map(q => `<li class="${q.kind === "блокер" ? "b" : ""}">${q.kind === "блокер" ? "Блокер: " : ""}${esc(q.text)}<small>${esc(q.to)}</small></li>`).join("")}</ul>` : "";

  function openSeen(key) {
    const s = D.seen.find(x => x.key === key), p = D.personas.find(x => x.id === s.persona), col = COLS[s.col];
    const html = s.steps.map(st => `<div class="stp">${st.screens.length ? `<div class="chips2">${[...new Set(st.screens.map(id => D.screens[id].contour))].map(chip).join("")}</div><div class="vis">${st.screens.map(id => mock(id, 170)).join("")}</div>` : ""}
      <h5>${esc(st.title)}</h5><p>${esc(st.text)}</p>${st.was ? `<div class="was"><b>Раньше</b>${esc(st.was)}</div>` : ""}
      ${qHTML(D.storyQuestions.filter(q => q.where === st.id || st.screens.includes(q.where)).map(q => ({ ...q, kind: "вопрос" })))}<div class="src">Источник: ${esc(st.source)}</div></div>`).join("");
    openSide(p.name, "#2f6b2a", col.name, `${esc(p.lane)} · ${s.steps.length} ${s.steps.length === 1 ? "шаг" : "шага"}`, html);
  }

  /* задача «Что делаем» — постановка для техлида из tasks/<ID>.md: ASIS, GAP, TOBE, HowToDemo,
     чеклист приемки, дополнительно; требования БФТ и открытые вопросы задачи добавляются из карты */
  const dodKey = id => `bp-dod-${D.epic}-${id}`;
  function openTask(id) {
    const t = TASK[id], br = (D.briefs || {})[id] || {}, qs = [...qOf(id), ...D.processes.filter(p => p.task === id).flatMap(p => qOf(p.id))];
    let done = {}; try { done = JSON.parse(localStorage.getItem(dodKey(id)) || "{}") } catch (e) { }
    let k = -1;
    const sec = (name, html) => html ? `<section class="tk"><h4>${name}</h4>${html}</section>` : "";
    const extra = [br["Дополнительно"] ? mdHTML(br["Дополнительно"]) : "",
      t.reqs.length ? `<p class="tkreq">Требования БФТ: ${t.reqs.map(esc).join(", ")}</p>` : "",
      qs.length ? `<ul class="tkq">${[...new Map(qs.map(q => [q.text, q])).values()].map(q => `<li class="${q.kind === "блокер" ? "b" : ""}">${q.kind === "блокер" ? "<b>Блокер.</b> " : ""}${esc(q.text)} <span>— ${esc(q.to)}</span></li>`).join("")}</ul>` : ""].join("");
    const dod = (br["Чеклист приемки"] || "").split("\n").map(l => l.trim().match(/^[-*]\s+\[([ xX])\]\s+(.*)$/)).filter(Boolean)
      .map(m => { k++; return `<label class="dod"><input type="checkbox" data-dod="${id}:${k}"${done[k] || m[1] !== " " ? " checked" : ""}><span>${mdInline(m[2])}</span></label>` }).join("");
    const html = br.ASIS ? sec("ASIS", mdHTML(br.ASIS)) + sec("GAP", mdHTML(br.GAP || "")) + sec("TOBE", mdHTML(br.TOBE || "")) + sec("HowToDemo", mdHTML(br.HowToDemo || "")) + sec("Чеклист приемки", dod) + sec("Дополнительно", extra)
      : `<p class="tkno">Постановки нет — tasks/${esc(id)}.md</p>` + sec("Дополнительно", extra);
    side.innerHTML = `<div class="snbar"><h3>${esc(t.text)}</h3><button class="x" aria-label="Закрыть">×</button></div><div class="snbody"><div class="tkmeta"><span class="pteam" style="--c:${teamC(t)}"><i></i>${esc(teamN(t))}</span> · ${esc(COLS[colOf(t.stage)].name)} · задача ${esc(t.id)}</div>${html}</div>`;
    body.classList.remove("wide"); body.classList.add("open"); side.scrollTop = 0;
  }


  /* цепочка процесса: что до и что после */
  function chainChip(id, lab) {
    if (!PROC[id]) return `<span class="cc ev">${esc(id)}</span>`;
    const p = PROC[id], t = TASK[p.task];
    return `<button class="cc" data-proc="${id}" style="--c:${teamC(t)}"><i></i><span><b>${esc(p.text)}</b><small>${esc(lab)}</small></span></button>`;
  }
  function critHTML(p) {
    return p.criteria.map(c => `<li class="${c.state}"><span class="ic">${c.state === "blocker" ? "!" : c.state === "ask" ? "?" : "✓"}</span><span>${esc(c.text.replace(/\s*—\s*БЛОКЕР/, ""))}${c.state === "blocker" ? "<em>Блокер</em>" : ""}<small>${esc(c.source)}</small></span></li>`).join("");
  }
  /* ---------- схемы как код: документ или правка в этом браузере ---------- */
  const lsGet = k => { try { return localStorage.getItem(k) || "" } catch (e) { return "" } };
  const lsSet = (k, v) => { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k) } catch (e) { } };
  const dslKey = (kind, id, draft) => `bp-dsl-${D.epic}-${kind}-${id}${draft ? "-draft" : ""}`;
  const hasErr = m => m.issues.some(i => i.level === "ERROR");
  /* текст блока из документа; блока нет — заготовка с ключами грамматики */
  const BLANK = { seq: "описание: \nA -> B: ", idef0: "вход: \nуправление: \nвыход: \nмеханизм: " };
  const docSrc = (kind, id) => (kind === "seq" ? PROC[id].src : TASK[id].idef && TASK[id].idef.src) || `\`\`\`${kind} ${id}\n${BLANK[kind]}\n\`\`\``;
  /* проверка блока для этой карточки: разбор как у линтера + ID блока совпадает с карточкой */
  function checkFor(kind, id, text) {
    const m = BPD.checkText(text, D.parts), off = BPD.extract(text).offset;
    if (m.kind && (m.kind !== kind || m.id !== id)) m.issues.unshift({ line: 0, level: "ERROR", code: "DG000", msg: `здесь блок \`\`\`${kind} ${id}\`\`\`, а не \`\`\`${m.kind} ${m.id}\`\`\`` });
    return { m, off };
  }
  /* действующая схема: применённая правка (если она без ошибок), иначе — документ */
  function seqOf(p) {
    const ov = lsGet(dslKey("seq", p.id));
    if (ov) { const { m } = checkFor("seq", p.id, ov); if (!hasErr(m)) return { ...m, local: true } }
    return { desc: p.desc, parts: p.parts, steps: p.steps, local: false };
  }
  function idefOf(t) {
    const ov = lsGet(dslKey("idef0", t.id));
    if (ov) { const { m } = checkFor("idef0", t.id, ov); if (!hasErr(m)) return { ...m, local: true } }
    return t.idef ? { ...t.idef, local: false } : null;
  }
  const teamHex = t => t.team === "?" ? "#c0392b" : getComputedStyle(document.documentElement).getPropertyValue(TEAM[t.team].c.slice(4, -1)).trim();
  const pname = (m, k) => ((m.parts && m.parts[k]) || D.parts[k] || [k])[0];
  const LOCAL = '<span class="loc">правка в браузере</span>';
  function seqHTML(m, uid) {
    const hid = BPD.hiddenSteps(m, D.parts);
    let x = `<div class="seqw">${BPD.seqSVG(m, D.parts, uid)}</div><div class="seqk"><span><i style="background:#2f6b2a"></i>видно человеку</span><span><i style="background:#2563c9"></i>скрыто от гостя</span><span>- - → ответ</span></div>`;
    if (hid.length) x += `<details class="pd"><summary>Что скрыто от гостя · ${hid.length}</summary><ol class="hidl">${hid.map(([n, s]) => `<li value="${n}"><b>${esc(pname(m, s.src))} → ${esc(pname(m, s.dst))}</b> ${esc(s.text)}</li>`).join("")}</ol></details>`;
    return x;
  }
  function idefHTML(t, f, uid) {
    const o = { title: t.text, color: teamHex(t), dashed: t.team === "?", uid };
    return BPD.idefSVG(f, o) + (f.children && f.children.length ? `<div class="lb2">Декомпозиция A0 → A1…A${f.children.length}</div><div class="idefw">${BPD.idefDecompSVG(f, { ...o, uid: uid + "d" })}</div>` : "");
  }

  function openProc(id, tab) {
    const p = PROC[id], t = TASK[p.task], L = LAYER[p.layer], sq = seqOf(p), fd = idefOf(t);
    const pre = D.links.filter(l => l.dst === id), post = D.links.filter(l => l.src === id);
    let x = `<div class="pchain"><div class="pc"><span class="lb">← До</span>${pre.map(l => chainChip(l.src, l.what)).join("") || '<span class="cc ev">—</span>'}</div>
      <div class="pc"><span class="lb">Этот процесс</span><div class="meb">${esc(p.text)}</div></div>
      <div class="pc"><span class="lb">После →</span>${post.map(l => chainChip(l.dst, l.what)).join("") || '<span class="cc ev">—</span>'}</div></div>`;
    if (p.before || p.after) x += `<div class="pab"><div><span class="lb">Было</span>${esc(p.before || "—")}</div><span class="ar">→</span><div><span class="lb">Станет</span><b>${esc(p.after || "—")}</b></div></div>`;
    if (p.criteria.length) x += `<h4>Что требуется</h4><ul class="crit">${critHTML(p)}</ul>`;
    const qs = [...qOf(id), ...qOf(p.task)]; if (qs.length) x += `<h4>Вопросы и блокеры</h4>${qHTML(qs)}`;
    x += `<h4 id="phow">Как устроено ${sq.local ? LOCAL : ""}</h4>`;
    if (sq.desc) x += `<p class="pdesc${U(sq.desc) ? " ask" : ""}">${esc(sq.desc)}</p>`;
    x += sq.steps.length ? seqHTML(sq, "m") : '<div class="pempty">Схемы пока нет — соберите её в «Схеме как коде» ниже</div>';
    if (fd) x += `<details class="pd"${fd.local ? " open" : ""}><summary>Задача целиком — IDEF0${fd.children && fd.children.length ? ` · декомпозиция на ${fd.children.length}` : ""}</summary>${fd.local ? LOCAL : ""}${idefHTML(t, fd, "p")}</details>`;
    x += `<details class="pd"><summary>Требования БФТ · ${t.reqs.length}</summary><div class="reqs">${t.reqs.map(r => `<span>${r}</span>`).join("")}</div>${p.source ? `<div class="src">Источник: ${esc(p.source)}</div>` : ""}</details>`;
    x += `<div class="pwork"><h4>Дополнить</h4><textarea id="pnote" placeholder="Контекст техлида: что подправить, что уже известно, ссылки">${esc(lsGet(noteKey(id)))}</textarea>
      <div class="pai"><div><b>Системная аналитика с ИИ</b><small>промпт собран из карточки: требования, цепочка, схема, вопросы и ваша заметка</small></div>
      <button class="tool" data-ai="copy" data-kind="sa" data-id="${id}">Скопировать промпт</button><a class="tool" data-ai="open" data-kind="sa" data-id="${id}" target="_blank" rel="noopener">Открыть в Claude ↗</a></div></div>`;
    x += `<div class="pwork dsl" id="dsl" data-id="${id}"><h4>Схема как код</h4>
      <div class="dtabs" role="tablist"><button data-dt="seq">Sequence · ${id}</button><button data-dt="idef0">IDEF0 · задача ${t.id}</button></div>
      <textarea class="dsrc" spellcheck="false" aria-label="Текст схемы"></textarea>
      <div class="dstat" aria-live="polite"></div><ul class="diss"></ul><div class="dprev"></div>
      <div class="dbtn"><button class="tool pri" data-dsl="apply">Применить к карточке</button><button class="tool" data-dsl="copy">Скопировать блок</button><button class="tool" data-dsl="reset">Вернуть из документа</button></div>
      <div class="pai"><div><b>Собрать схему с ИИ</b><small>промпт: грамматика, участники и контекст карточки. Ответ ИИ вставьте в поле — проверка сразу</small></div>
      <button class="tool" data-ai="copy" data-kind="dsl" data-id="${id}">Скопировать промпт</button><a class="tool" data-ai="open" data-kind="dsl" data-id="${id}" target="_blank" rel="noopener">Открыть в Claude ↗</a></div>
      <small class="dhint">Правка живёт в этом браузере. В документ — блок через <code>bft-diagram-apply.py</code>, затем перерисовать карту.</small></div>`;
    openSide(`${L[0]} · ${L[1]}`, L[2], p.text, `<span class="pteam" style="--c:${teamC(t)}"><i></i>${esc(teamN(t))}</span> · задача ${t.id} «${esc(t.text)}» · ${esc(COLS[colOf(p.stage)].name)}`, x, true);
    const ta = document.getElementById("pnote");
    ta.addEventListener("input", () => { lsSet(noteKey(id), ta.value); refreshAi() });
    dslTab(tab || "seq");
    const src = side.querySelector(".dsrc"); let tm = 0;
    src.addEventListener("input", () => { const d = side.querySelector("#dsl"); lsSet(dslKey(d.dataset.kind, d.dataset.target, true), src.value); clearTimeout(tm); tm = setTimeout(dslCheck, 150) });
  }
  const noteKey = id => `bp-note-${D.epic}-${id}`;

  /* редактор: вкладка, проверка, предпросмотр */
  function dslTab(kind) {
    const d = side.querySelector("#dsl"), p = PROC[d.dataset.id], target = kind === "seq" ? p.id : p.task;
    d.dataset.kind = kind; d.dataset.target = target;
    d.querySelectorAll("[data-dt]").forEach(b => { b.classList.toggle("on", b.dataset.dt === kind); b.setAttribute("aria-selected", b.dataset.dt === kind) });
    d.querySelector(".dsrc").value = lsGet(dslKey(kind, target, true)) || lsGet(dslKey(kind, target)) || docSrc(kind, target);
    dslCheck(); refreshAi();
  }
  function dslCheck() {
    const d = side.querySelector("#dsl"); if (!d) return null;
    const kind = d.dataset.kind, target = d.dataset.target, { m, off } = checkFor(kind, target, d.querySelector(".dsrc").value);
    const err = m.issues.filter(i => i.level === "ERROR").length, warn = m.issues.length - err;
    d.querySelector(".dstat").className = "dstat " + (err ? "bad" : "good");
    d.querySelector(".dstat").textContent = err ? `✗ Ошибок: ${err}${warn ? ` · предупреждений: ${warn}` : ""} — схема не применится` : `✓ Синтаксис в порядке${warn ? ` · предупреждений: ${warn}` : ""}`;
    d.querySelector(".diss").innerHTML = m.issues.map(i => `<li class="${i.level === "ERROR" ? "e" : "w"}"><b>стр. ${i.line + off}</b><code>${i.code}</code>${esc(i.msg)}</li>`).join("");
    const t = TASK[PROC[d.dataset.id].task];
    const same = blockKey(d.querySelector(".dsrc").value) === blockKey(lsGet(dslKey(kind, target)) || docSrc(kind, target));
    d.querySelector(".dprev").innerHTML = err ? "" : same ? '<div class="psame">Совпадает со схемой в карточке — измените текст или вставьте ответ ИИ</div>'
      : `<div class="lb2">Предпросмотр</div>${kind === "seq" ? seqHTML(m, "v") : idefHTML(t, m, "v")}`;
    d.querySelector('[data-dsl="apply"]').disabled = !!err;
    return { m, err };
  }
  /* блок без пустых строк и отступов — чтобы сравнить «то же самое» */
  const blockKey = text => { const ex = BPD.extract(text); return ex.kind ? [ex.kind, ex.id, ...ex.body.map(l => l.trim()).filter(Boolean)].join("\n") : text.trim() };
  function dslAction(act) {
    const d = side.querySelector("#dsl"), kind = d.dataset.kind, target = d.dataset.target, ta = d.querySelector(".dsrc");
    if (act === "copy") { const ex = BPD.extract(ta.value); return copyText(ex.kind ? [`\`\`\`${ex.kind} ${ex.id}`, ...ex.body, "```"].join("\n") : ta.value, d.querySelector('[data-dsl="copy"]')) }
    if (act === "apply") { const r = dslCheck(); if (!r || r.err) return; const ex = BPD.extract(ta.value); lsSet(dslKey(kind, target), [`\`\`\`${ex.kind} ${ex.id}`, ...ex.body, "```"].join("\n")) }
    if (act === "reset") lsSet(dslKey(kind, target), "");
    lsSet(dslKey(kind, target, true), "");
    openProc(d.dataset.id, kind);
    if (act === "apply") { const h = side.querySelector(kind === "seq" ? "#phow" : "details.pd"); if (h) side.scrollTop = h.offsetTop - 110 }
  }

  /* ---------- промпты для ИИ ---------- */
  function procContext(id) {
    const p = PROC[id], t = TASK[p.task], nm = x => PROC[x] ? PROC[x].text : x, note = lsGet(noteKey(id));
    return `Процесс ${id}: ${p.text}
Задача ${t.id} «${t.text}», команда: ${teamN(t)}, шаг пути: ${COLS[colOf(p.stage)].name}, слой: ${LAYER[p.layer][0]}.
Было: ${p.before || "—"}. Станет: ${p.after || "—"}.
До: ${D.links.filter(l => l.dst === id).map(l => `${nm(l.src)} (${l.what})`).join("; ") || "—"}.
После: ${D.links.filter(l => l.src === id).map(l => `${nm(l.dst)} (${l.what})`).join("; ") || "—"}.

Что требуется (из БФТ):
${p.criteria.map(c => `- ${c.text} (${c.source})`).join("\n") || "—"}

Открытые вопросы:
${[...qOf(id), ...qOf(p.task)].map(q => `- ${q.kind === "блокер" ? "БЛОКЕР: " : ""}${q.text} (кому: ${q.to})`).join("\n") || "—"}
${note ? `\nЗаметка техлида: ${note}\n` : ""}
Источник: БФТ ${D.epic}${p.source ? `, ${p.source}` : ""}.`;
  }
  function aiPrompt(id) {
    const p = PROC[id], sq = seqOf(p);
    let n = 0; const steps = sq.steps.map(s => `${++n}. ${s.branch ? `[${s.branch}] ` : ""}${pname(sq, s.src)} → ${pname(sq, s.dst)}: ${s.text}`);
    return `Ты — системный аналитик. Проведи системную аналитику процесса инициативы «${D.title}».

${procContext(id)}

Как устроено${sq.desc ? `: ${sq.desc}` : ""}
${steps.join("\n") || "—"}

Задача:
1) найди пробелы, противоречия и неявные зависимости в процессе;
2) опиши альтернативные и ошибочные сценарии, которых нет в БФТ;
3) предложи, какие состояния, данные и интеграции нужны — помечай это как гипотезу для СА;
4) сформулируй вопросы «кому — что», без которых процесс не запустить.`;
  }
  function dslPrompt(id, kind) {
    const p = PROC[id], t = TASK[p.task], target = kind === "seq" ? id : t.id;
    const cur = lsGet(dslKey(kind, target, true)) || lsGet(dslKey(kind, target)) || docSrc(kind, target);
    const parts = Object.keys(D.parts).map(k => `${k}: ${D.parts[k][0]} (${{ p: "человек", i: "интерфейс", s: "система", x: "внешний" }[D.parts[k][1]]})`).join("; ");
    return `Ты — системный аналитик. Собери ${kind === "seq" ? `sequence-схему процесса ${id}` : `IDEF0 задачи ${t.id} «${t.text}» с декомпозицией на функции`} инициативы «${D.title}». Опирайся только на контекст ниже; чего в нём нет — пиши [УТОЧНИТЬ у <кого>], не придумывай.

Грамматика — строго:
${BPD.GRAMMAR[kind]}
${kind === "seq" ? `\nУчастники карты: ${parts}.\n` : ""}
${procContext(id)}

Сейчас:
${cur}

Верни только один блок \`\`\`${kind} ${target} … \`\`\` без пояснений до и после.`;
  }
  function promptFor(el) { return el.dataset.kind === "dsl" ? dslPrompt(el.dataset.id, side.querySelector("#dsl").dataset.kind) : aiPrompt(el.dataset.id) }
  function refreshAi() { side.querySelectorAll('[data-ai="open"]').forEach(a => a.href = "https://claude.ai/new?q=" + encodeURIComponent(promptFor(a))) }
  function copyText(txt, btn) {
    const lab = btn.textContent, done = () => { btn.textContent = "Скопировано ✓"; setTimeout(() => btn.textContent = lab, 1600) };
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(done).catch(() => { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done() } catch (er) { } ta.remove() });
  }

  /* ---------- инструкции, легенда, блокеры ---------- */
  const DOCS = "https://github.com/po-helper-org/poh-bft-writer/blob/main/docs/guides/blueprint/";
  const ARTICLES = [["service-blueprint.md", "#2563c9", "SB", "Методология Service Blueprint и карта опыта", "Откуда эта карта: Service Blueprint, карта процесса-опыта, линии взаимодействия, видимости и внутреннего взаимодействия."],
    ["how-to-read.md", "#2f6b2a", "?", "Как читать карту", "Что видят, что делаем, как это работает — и куда нажимать."],
    ["product-storytelling.md", "#6b3fd4", "PS", "Product Storytelling: история через экраны", "Как устроен сюжет «было → шаги → стало» и почему история помогает проектировать."],
    ["idef0.md", "#d06a12", "I0", "IDEF0: функция на одной схеме", "Входы, регуляторы, выходы, механизмы — и кому из команды это нужно."],
    ["bft.md", "#1c1c1c", "БФТ", "БФТ: бизнес-функциональные требования", "Откуда карта берёт каждый шаг и задачу и как вопросы с карты возвращаются в требования."]];
  function openGuide(kind) {
    if (kind === "help") openSide("Инструкции", "#555", "Как работать с картой", "", ARTICLES.map(([f, c, ic, t, d], i) => `<a class="art" href="${DOCS + f}" target="_blank" rel="noopener"><span class="ic" style="background:${c}">${ic}</span><span><b>${i + 1}. ${esc(t)}</b><span>${esc(d)}</span><em>Читать на GitHub ↗</em></span></a>`).join(""));
    else if (kind === "blk") openSide("Блокеры", "var(--red)", `Блокеров: ${uniqBlk.length}`, "", D.questions.filter(q => q.open && q.kind === "блокер").map(q => `<div class="bcard" data-${TASK[q.where] ? "task" : "proc"}="${q.where}"><b>${esc(q.text)}</b><small>${esc(q.to)} · ${esc(TASK[q.where] ? TASK[q.where].text : PROC[q.where].text)}</small></div>`).join(""));
    else openSide("Легенда", "#555", "Условные обозначения", "", `<div class="lg"><h4>Колонки</h4><div class="row"><i><span class="mh" style="position:static;padding:0!important;background:none"><span class="n">1</span></span></i><span>Шаг пути<small>слева направо — от подготовки до итога</small></span></div>
      <h4>Что видят</h4><div class="row"><i><span class="box" style="background:#fff;border:1px solid var(--line)"></span></i><span>Экран и фраза гостя или ресторана<small>по клику — все шаги этапа, экраны, вопросы</small></span></div>
      <h4>Что делаем — цвет команды</h4>${D.teams.filter(t => used[t.id]).map(t => `<div class="row"><i><span class="sw" style="background:${TEAM[t.id].c}"></span></i><span>${esc(t.name)}</span></div>`).join("")}${used["?"] ? `<div class="row"><i><span class="sw" style="border:1.5px dashed var(--red)"></span></i><span>Команда не определена</span></div>` : ""}
      <div class="row"><i><span class="qn">2</span></i><span>Открытые вопросы</span></div><div class="row"><i><span class="bl" style="margin:0">Блокер</span></i><span>Без решения задача не стартует</span></div>
      <h4>Как это работает</h4><div class="row"><i><span class="box" style="background:#e5f3f4"></span></i><span>Frontstage<small>то, что видит гость</small></span></div><div class="row"><i><span class="box" style="background:#e7edf8"></span></i><span>Backstage<small>за кадром</small></span></div><div class="row"><i><span class="box" style="background:#efecf6"></span></i><span>Support<small>общие ресурсы и внешние каналы</small></span></div>
      <div class="row"><i><span class="ln1"></span></i><span>Линия взаимодействия</span></div><div class="row"><i><span class="ln2"></span></i><span>Линия видимости</span></div><div class="row"><i><span class="ln3"></span></i><span>Линия внутреннего взаимодействия</span></div>
      <div class="row"><i><span class="dot inl"></span></i><span>На экране есть вопрос</span></div></div>`);
  }

  /* ---------- история по шагам ---------- */
  let showP = D.personas[0].id, showI = 0; const show = document.getElementById("show");
  function scene() {
    const steps = D.story.filter(s => s.persona === showP), s = steps[showI], p = D.personas.find(x => x.id === showP);
    const vis = s.screens.length ? `<div class="vis2">${s.screens.map(id => mockSVG(D.screens[id], D.screens[id].contour)).join("")}</div>` : s.big ? `<div class="big">${esc(s.big)}</div>` : "<div></div>";
    show.querySelector(".stage").innerHTML = `<div class="scene">${vis}<div><div class="n">${esc(s.label)}</div><h2>${esc(s.title)}</h2><p class="say">${esc(s.text)}</p>${s.was ? `<div class="was"><b>Раньше</b>${esc(s.was)}</div>` : ""}</div></div>`;
    show.querySelector(".whos").innerHTML = D.personas.map(x => `<button data-p="${x.id}" class="${x.id === showP ? "on" : ""}">${esc(x.lane)}</button>`).join("");
    show.querySelector(".prev").disabled = showI === 0; show.querySelector(".next").disabled = showI === steps.length - 1;
  }
  const stepShow = d => { const n = D.story.filter(s => s.persona === showP).length; showI = Math.max(0, Math.min(n - 1, showI + d)); scene() };
  document.getElementById("play").addEventListener("click", () => { showP = D.personas[0].id; showI = 0; body.classList.add("showing"); scene() });
  show.addEventListener("click", e => { if (e.target.closest(".x")) body.classList.remove("showing"); else if (e.target.closest(".prev")) stepShow(-1); else if (e.target.closest(".next")) stepShow(1); else { const b = e.target.closest("[data-p]"); if (b) { showP = b.dataset.p; showI = 0; scene() } } });

  /* ---------- клики и клавиатура ---------- */
  document.addEventListener("click", e => {
    const t = e.target;
    if (!LB.hidden) { const b = t.closest("[data-lb]"); if (b) return zoom(lbI + +b.dataset.lb); if (!t.closest("img")) LB.hidden = true; return }
    if (t.closest(".side .x") || t.closest(".scrim")) return closeSide();
    const zm = t.closest("[data-zoom]"); if (zm) return zoom(+zm.dataset.zoom);
    const st = t.closest("[data-sntab]"); if (st) return openScreen(snCur, +st.dataset.sntab);
    const nt = t.closest("[data-snnote]"); if (nt) return openNote(+nt.dataset.snnote);
    if (t.closest("[data-snback]")) return openScreen(snCur);
    if (t.closest("#burger")) return menu(!body.classList.contains("mopen"));
    if (t.closest('[data-menu="close"]') || t.closest(".mscrim")) return menu(false);
    if (t.closest("[data-tf-clear]")) return teamFilter("");
    if (t.closest("#menu [data-guide]") || t.closest("#menu .play")) menu(false);
    const sl = t.closest("[data-sl]"); if (sl) return slide(sl.closest(".pic"), +sl.dataset.sl);
    const dd = t.closest("[data-dot]"); if (dd) return slide(dd.closest(".fr").querySelector(".pic"), 0, +dd.dataset.dot);
    const ai = t.closest("[data-ai]");
    if (ai) {
      if (ai.dataset.ai === "open") { ai.href = "https://claude.ai/new?q=" + encodeURIComponent(promptFor(ai)); return }
      return copyText(promptFor(ai), ai);
    }
    const dt = t.closest("[data-dt]"); if (dt) return dslTab(dt.dataset.dt);
    const da = t.closest("[data-dsl]"); if (da) return dslAction(da.dataset.dsl);
    const tf = t.closest("[data-tf]");
    if (tf) { teamFilter(tf.classList.contains("on") ? "" : tf.dataset.tf); return menu(false) }
    const g = t.closest("[data-guide]"); if (g) return openGuide(g.dataset.guide);
    const pr = t.closest("[data-proc]"); if (pr) return openProc(pr.dataset.proc);
    const tk = t.closest("[data-task]"); if (tk) return openTask(tk.dataset.task);
    /* кадр с требованиями: открыть экран, который сейчас виден в кадре */
    const scr = t.closest("[data-screens]");
    if (scr) { const ids = scr.dataset.screens.split(","), pic = scr.querySelector(".pic"), now = ids[+(pic && pic.dataset.i) || 0]; return openScreen(NOTE_OF[now] ? now : ids.find(id => NOTE_OF[id]), 0) }
    const sn = t.closest("[data-seen]"); if (sn) return openSeen(sn.dataset.seen);
  });
  document.addEventListener("change", e => {
    const c = e.target.closest && e.target.closest("[data-dod]"); if (!c) return;
    const [id, k] = c.dataset.dod.split(":"); let d = {}; try { d = JSON.parse(localStorage.getItem(dodKey(id)) || "{}") } catch (er) { }
    d[k] = c.checked; try { localStorage.setItem(dodKey(id), JSON.stringify(d)) } catch (er) { }
  });
  document.addEventListener("keydown", e => {
    if (body.classList.contains("showing")) { if (e.key === "ArrowRight") stepShow(1); else if (e.key === "ArrowLeft") stepShow(-1); else if (e.key === "Escape") body.classList.remove("showing"); return }
    if (!LB.hidden) { if (e.key === "Escape") LB.hidden = true; else if (gallery.length > 1 && e.key === "ArrowRight") zoom(lbI + 1); else if (gallery.length > 1 && e.key === "ArrowLeft") zoom(lbI - 1); return }
    if (e.key === "Escape") { if (body.classList.contains("mopen")) { menu(false); burger.focus() } else if (side.querySelector("[data-snback]")) openScreen(snCur); else closeSide() }
    if (e.key === "Enter" && e.target.matches && e.target.matches("[data-snnote]")) openNote(+e.target.dataset.snnote);
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-seen]")) { e.preventDefault(); openSeen(e.target.dataset.seen) }
  });
  window.BPMAP = { aiPrompt, dslPrompt, openProc, openTask, openSeen, openScreen, openNote, zoom, dslTab, dslCheck };
})();
</script>
</body></html>
