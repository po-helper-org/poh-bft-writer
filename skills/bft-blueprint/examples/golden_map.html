<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карта · bartello-restart</title>
<style>
/* bft-blueprint · карта инициативы. Стандарт — resources/map_rules.md */
:root{--ink:#1c1c1c;--muted:#6b6b6b;--red:#c0392b;--line:#e7e3dc;--soft:#f7f5f1;--rule:#cfcac0;--story:#2f6b2a;--storybg:#eef3ea;--offer:#6b3fd4;
--t0:#0f8b8d;--t1:#8a5a2b;--t2:#2563c9;--t3:#d06a12;--t4:#c2338a;--t5:#3f8a2a;--t6:#7a7a7a;--t7:#5b4bb7;--t8:#b8860b;--t9:#2a7f62}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.45 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit}
.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff;z-index:3}
.dot.inl{position:static;display:inline-block;vertical-align:-1px}
/* меню вместо шапки: кнопка поверх карты, остальное — в выезжающей панели */
.ptitle{display:none}
.fab{position:fixed;top:12px;left:16px;z-index:7;display:flex;align-items:center;gap:8px}
.burger{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;cursor:pointer}
.burger:hover{box-shadow:0 4px 14px rgba(0,0,0,.12)}.burger svg{width:18px;height:18px;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;fill:none}
.bdot:empty{display:none}.bdot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
.fchip{display:inline-flex;align-items:center;gap:7px;height:32px;border:0;border-radius:999px;background:var(--c);color:#fff;font-size:12.5px;font-weight:650;padding:0 8px 0 12px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.fchip i{width:7px;height:7px;border-radius:50%;background:#fff}.fchip span{font-size:15px;line-height:1;opacity:.85;padding:0 2px}
.mscrim{position:fixed;inset:0;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.menu{position:fixed;top:0;left:0;height:100%;width:min(340px,100%);background:#fff;box-shadow:8px 0 24px rgba(0,0,0,.16);transform:translateX(-105%);transition:transform .22s;z-index:11;overflow-y:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
body.mopen .menu{transform:none}body.mopen .mscrim{opacity:1;pointer-events:auto}
.mtop{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.mtop h1{margin:6px 0 0;font-size:18px;font-weight:700;line-height:1.3;letter-spacing:-.1px}
.mtop .x{flex:none;border:0;background:none;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 4px}
.draft{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#9a6a12}.draft::before{content:"";width:7px;height:7px;border-radius:50%;background:#e0a526}
.draft.ok{color:var(--story)}.draft.ok::before{background:var(--story)}
.play{border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:650;font-size:14px;padding:11px 14px;cursor:pointer;text-align:left}
.mlist{display:flex;flex-direction:column;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;font-size:14px;font-weight:600;color:var(--ink);padding:9px 8px;border-radius:9px;cursor:pointer;text-align:left}
.mi:hover{background:#f5f3ef}.mi svg{flex:none;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:#6b6b6b}
.mi.blk{color:var(--red)}.mi.blk svg{color:var(--red)}.mi .cnt{margin-left:auto}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:0 6px}
.mlab{font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:-6px}
.teams{display:flex;flex-direction:column}
.tchip{display:flex;align-items:center;gap:10px;width:100%;font-size:14px;font-weight:500;color:var(--ink);background:none;border:0;border-radius:9px;padding:8px;cursor:pointer;text-align:left}
.tchip:hover{background:#f5f3ef}.tchip b{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.tchip i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c)}.tchip i.u{background:#fff;border:1.5px dashed var(--red)}
.tchip.on{background:var(--c);color:#fff}.tchip.on b{color:rgba(255,255,255,.85)}.tchip.on i{background:#fff}
.tool{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:650;background:#fff;border:1px solid #dcd7cd;border-radius:999px;padding:8px 14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.tool:hover{background:#f6f4f0}.tool svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* первый экран: что видят — на всю высоту, путь уходит вправо */
.hero{--lw:132px;position:relative;height:100vh;min-height:560px;background:var(--soft);border-bottom:1px solid var(--line)}
.hscroll{height:100%;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;scroll-snap-type:x proximity;scroll-padding-left:var(--lw);overscroll-behavior-x:contain}
.hgrid{display:grid;grid-template-rows:auto repeat(var(--p),auto);align-content:center;min-height:100%;padding:8px 0 52px;width:max-content}
.hc0,.hl{position:sticky;left:0;z-index:3;background:linear-gradient(90deg,var(--soft) 82%,rgba(247,245,241,0))}
.hh{padding:22px 14px 12px;scroll-snap-align:start;border-left:1px solid var(--line)}
.hhs{position:sticky;left:calc(var(--lw) + 14px);display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;max-width:360px}
.hh .n{font-size:12px;font-weight:700;color:#9a958c;font-variant-numeric:tabular-nums}.hh b{font-size:17px;font-weight:700;letter-spacing:-.1px}
.hh small{flex-basis:100%;padding-left:18px;font-size:12.5px;color:var(--muted)}
.hl{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 18px 0 24px;color:#55524c}
.hl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.hl b{font-size:15px;color:var(--ink)}.hl small{font-size:11.5px;line-height:1.35;color:var(--muted)}
.hcell{display:flex;gap:18px;padding:6px 16px 14px;min-height:0;border-left:1px solid var(--line)}
/* кадр раскадровки: экран картинкой без подложки, подпись без акцента */
.fr{--ph:clamp(170px,calc((100vh - 210px) / var(--p) - 62px),300px);position:relative;flex:none;width:196px;display:flex;flex-direction:column;gap:10px;cursor:pointer;outline:none}
.fr .pic{position:relative;display:block;height:var(--ph);overflow:hidden;border-radius:14px 14px 0 0;-webkit-mask-image:linear-gradient(#000 74%,transparent);mask-image:linear-gradient(#000 74%,transparent)}
.track{display:flex;height:100%;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.sld{flex:none;width:100%;height:100%;display:flex;justify-content:center;padding-top:6px}
.sld img{height:calc(var(--ph) * 1.18);width:auto;display:block;transition:transform .2s}
.fr:hover .sld img,.fr:focus-visible .sld img{transform:translateY(-4px)}
.fr .dot{top:4px;right:20px;width:9px;height:9px;border-width:1.5px}
.cap{font-size:13.5px;line-height:1.4;font-weight:400;color:#3e3c38;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.fr:hover .cap,.fr:focus-visible .cap{color:var(--ink)}
.sl{position:absolute;top:42%;z-index:2;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;color:var(--ink);opacity:0;transition:opacity .15s}
.sl.prev{left:4px}.sl.next{right:4px}.fr:hover .sl{opacity:1}
.dots{position:absolute;left:0;right:0;top:calc(var(--ph) - 8px);z-index:2;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(28,28,28,.25);transition:width .2s,background .2s}.dots i.on{width:16px;background:var(--ink)}
.fr.fin .pic{display:flex;align-items:center;justify-content:center;background:#eef5ea;border-radius:14px;-webkit-mask-image:none;mask-image:none;height:calc(var(--ph) * .8)}
.fr.fin .big{font-size:44px;font-weight:800;color:var(--story);line-height:1}
.hnav{position:absolute;top:50%;z-index:4;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:26px;line-height:1;color:var(--ink);cursor:pointer}
.hnav.prev{left:calc(var(--lw) + 8px)}.hnav.next{right:16px}.hnav[hidden]{display:none}
.hdown{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:13px;font-weight:600;color:#55524c;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.hdown:hover{color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.08)}
/* карта */
.wrap{height:100vh;overflow:auto;background:var(--soft);overscroll-behavior:contain}
.map{position:relative;display:grid;background:var(--soft)}
.map>div{padding:10px 8px}
.mh{position:sticky;top:0;z-index:4;background:var(--soft);display:flex;align-items:baseline;gap:8px;padding:16px 10px 10px!important}
.mh .n{flex:none;font-size:12px;font-weight:700;color:#9a958c;font-variant-numeric:tabular-nums;min-width:12px}
.mh .hx{display:flex;flex-direction:column}.mh b{font-size:14px;font-weight:700;line-height:1.25}.mh small{font-size:12px;color:var(--muted);margin-top:1px}
.mh.corner,.ml{position:sticky;left:0;background:var(--soft)}.mh.corner{z-index:6}
.ml{z-index:3;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:18px 8px 8px 24px!important}
.mc{display:flex;flex-direction:column;gap:8px;padding-top:4px!important;padding-bottom:22px!important}
/* что видят */
.seen,.wk,.hw{width:100%}
.seen{position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid transparent;border-radius:12px;padding:10px 12px 10px 10px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.seen:hover,.seen:focus-visible,.wk:hover,.wk:focus-visible,.hw:hover,.hw:focus-visible{border-color:#cfc8bb;box-shadow:0 6px 18px rgba(0,0,0,.08);outline:none}
.seen .th{position:relative;flex:none;width:46px}.seen .th svg{width:46px;height:auto;display:block}.seen .th .dot{top:-3px;right:-4px;width:9px;height:9px;border-width:1.5px}
.seen .sx{display:flex;flex-direction:column;gap:3px;min-width:0}
.who{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--muted)}.who svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.seen b{font-size:13px;line-height:1.3;font-weight:700;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.seen p{margin:0;font-size:12px;line-height:1.4;color:#77736b;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.seen .more{align-self:flex-start;margin-top:3px;font-size:11px;font-weight:600;color:#77736b;background:var(--soft);border-radius:999px;padding:1px 8px}
.seen.fin{flex-direction:column;gap:4px;background:#f2f8ef;padding:12px 14px}.seen.fin .big{font-size:24px;font-weight:800;color:var(--story);line-height:1.1;-webkit-line-clamp:1}
/* что делаем */
.wk{position:relative;display:flex;flex-direction:column;gap:4px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px 9px;cursor:pointer;transition:opacity .2s}
.tm{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:#55524c}.tm i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tm.u{color:var(--red)}.tm.u i{background:#fff;border:1.5px dashed var(--red)}
.wk .tx{font-size:12.5px;line-height:1.36}
.wk.blk{border-color:#efc3bd;background:#fff8f7}
.bl{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:5px;padding:1px 6px}
.qn{margin-left:auto;min-width:17px;height:17px;border-radius:9px;background:#fbe3e0;color:var(--red);font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.dim{opacity:.15}
/* как это работает */
.hsec{grid-column:1/-1;padding:22px 24px 8px!important;border-top:1px solid var(--line);background:#fff}
.hsec span{font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.ml.hrow{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);background:#fff}.ml.hrow small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:1px}
.mc.how{background:#fff;padding:14px 8px!important;justify-content:center}
.l-front{border-top:1.5px solid #cfcac0}.l-back{border-top:1.5px dashed #9a958c}.l-sup{border-top:1.5px dotted #9a958c}
.hw{position:relative;z-index:2;display:flex;gap:6px;align-items:flex-start;text-align:left;font-size:12.5px;line-height:1.35;border-radius:10px;padding:9px 11px;cursor:pointer;border:1px solid transparent;transition:opacity .2s}
.hw span{flex:1}.hw i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:4px}
.hw.front{background:#e5f3f4;color:#0d4e50}.hw.back{background:#e7edf8;color:#1d3d70}.hw.sup{background:#efecf6;color:#41356b}
.hw.blk{box-shadow:inset 0 0 0 1.5px var(--red)}
svg.hwl{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:1}
/* панели */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
.side{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .22s;overflow-y:auto;z-index:9}
body.open .side{transform:none}body.open .scrim{opacity:1;pointer-events:auto}body.wide .side{width:min(860px,100%)}
.side .stop{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;padding:14px 56px 12px 20px;z-index:2}
.side .tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.6px;color:#fff;background:var(--c,#555);border-radius:5px;padding:2px 8px;text-transform:uppercase}
.side h3{margin:6px 0 2px;font-size:20px;line-height:1.25}.side .meta{font-size:13px;color:var(--muted)}
.side .x{position:absolute;right:14px;top:10px;border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--muted)}
.side .sin{padding:12px 20px 40px}
.side h4{font-size:11.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.pteam{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--ink)}.pteam i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.why{background:#f6f4f0;border-radius:10px;padding:10px 12px;font-size:14px}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.qlist li{font-size:13.5px;padding:7px 10px;border-radius:9px;background:#fffaf9;border:1px solid #f2d3cf}.qlist li.b{background:#fdf3f2;border-color:#efc3bd;color:var(--red);font-weight:600}
.qlist li small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.reqs{display:flex;flex-wrap:wrap;gap:6px}.reqs span{font-size:12px;font-weight:700;background:#f3f1ec;border-radius:6px;padding:2px 8px}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
/* цепочка, было → станет, критерии */
.pchain{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px;margin:4px 0 12px}
.pc{display:flex;flex-direction:column;gap:6px}.lb{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.meb{flex:1;display:flex;align-items:center;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;line-height:1.35}
.cc{display:flex;gap:8px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.cc:hover{border-color:#cfc8bb}.cc i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:5px}
.cc b{display:block;font-size:12.5px;line-height:1.3}.cc small{display:block;font-size:11.5px;color:var(--muted)}
.cc.ev{cursor:default;font-size:12.5px;color:#5d5a54;background:#f6f4f0;border-style:dashed}
.pab{display:flex;gap:10px;background:#f6f4f0;border-radius:12px;padding:10px 12px;font-size:13.5px}
.pab>div{flex:1;display:flex;flex-direction:column;gap:2px}.pab .ar{align-self:center;color:var(--muted)}.pab b{color:var(--story)}
ul.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.crit li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4;padding:7px 10px;border-radius:9px;border:1px solid var(--line)}
.crit .ic{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;background:var(--story)}
.crit li.ask{background:#fffaf9;border-color:#f2d3cf}.crit li.ask .ic{background:#e8a29a}.crit li.blocker{background:#fdf3f2;border-color:#efc3bd}.crit li.blocker .ic{background:var(--red)}
.crit small{display:block;font-size:11.5px;color:var(--muted)}.crit em{font-style:normal;margin-left:6px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:5px;padding:1px 6px}
/* схема */
.seqw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.seqw svg{display:block;height:auto}
.seqk{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 2px 0}.seqk i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.hidl{margin:0;padding-left:26px;font-size:13.5px}.hidl li{margin:4px 0}.hidl li::marker{color:#2563c9;font-weight:800}.hidl b{color:#1d3d70;margin-right:4px}
.src{font-size:12px;color:var(--muted);margin-top:8px}
details.pd{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}details.pd summary{cursor:pointer;font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);list-style:none}
details.pd summary::before{content:"▸ "}details.pd[open] summary::before{content:"▾ "}details.pd>*:not(summary){margin-top:10px}
svg.idef{width:100%;max-width:600px;height:auto;display:block;margin:0 auto}
.pwork{margin-top:18px;background:#f4f7fb;border:1px solid #dbe4f0;border-radius:14px;padding:12px 14px}.pwork h4{margin:0 0 8px}
.pwork textarea{width:100%;min-height:70px;font:inherit;font-size:13.5px;border:1px solid #d4dce8;border-radius:10px;padding:8px 10px;resize:vertical;background:#fff}
.pai{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:10px}.pai>div{flex:1 1 260px}.pai b{display:block;font-size:13.5px}.pai small{font-size:12px;color:var(--muted)}
/* шаг истории в панели */
.vis{display:flex;gap:14px;flex-wrap:wrap;background:#f3f1ec;border-radius:14px;padding:14px;justify-content:center;margin:8px 0}.vis svg{width:170px;height:auto;display:block}
.ctr{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;color:#3a3a3a;border:1px solid #e3dfd6;border-radius:999px;padding:3px 10px 3px 7px;background:#faf9f6}
.ctr svg{width:14px;height:14px;stroke:#3a3a3a;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

ло привязано к брони.","screens":["A1"],"big":""},{"persona":"rest","label":"Шаг 2 · Узнаю о скидке","title":"Гости знают о скидке заранее","text":"О нас рассказывают гостю сразу после покупки, в письме и в напоминаниях — он видит нас среди ближайших к площадке.","was":"О скидке узнавали меньше 1% гостей — до ресторанов почти никто не доходил.","screens":[],"big":""},{"persona":"rest","label":"Шаг 3 · В ресторане","title":"Гость показывает билет — сканируем","text":"Гость показывает билет — официант сканирует штрихкод.","was":"Отдельного приложения для официанта не было.","screens":["F2"],"big":""},{"persona":"rest","label":"Шаг 4 · В ресторане","title":"Приложение сразу даёт ответ","text":"Приложение сразу отвечает: скидка 10% или понятная причина отказа — без споров.","was":"","screens":["F3","F4"],"big":""},{"persona":"rest","label":"Шаг 5 · В ресторане","title":"Фотографируем чек — получаем компенсацию","text":"Официант фотографирует чек — компенсация ресторану зафиксирована.","was":"","screens":["F5"],"big":""},{"persona":"rest","label":"Шаг 6 · В ресторане","title":"Если что-то непонятно — помощь рядом","text":"Инструкция, частые вопросы и поддержка — в том же приложении.","was":"","screens":["F6"],"big":""},{"persona":"rest","label":"И с тех пор","title":"Больше гостей — и понятный способ их принять","text":"К нам приходят гости после спектаклей и концертов. Официант за одно сканирование понимает, давать ли скидку, а ресторан получает за неё компенсацию.","was":"","screens":[],"big":""}],"screens":{"A1":{"contour":"Приложение-сканер","device":"phone","view":"основной","el":[["hdr","Сканер билетов"],["ok","Подключён"],["text","Инструкция, FAQ и поддержка — внутри"]]},"B1":{"contour":"Витрина","device":"web","view":"основной","el":[["hdr","✓ Билет куплен"],["offer","Скидка 10% в ресторанах рядом"],["tiles"],["cta","Выбрать ресторан"]]},"C1":{"contour":"Email","device":"mail","view":"основной","el":[["from","Ticketland"],["hdr","Ваш билет Ticketland"],["text","Детали заказа"],["offer","Скидка 10% в Bartello"],["cta","Выбрать ресторан"],["cta2","Забронировать"]]},"D1":{"contour":"Витрина","device":"web","view":"основной","el":[["hdr","Все рестораны"],["chips",["Персоны","Метро","+3"]],["rowsOffer",3]]},"D2":{"contour":"Витрина","device":"web","view":"основной","el":[["img"],["offer","−10% по билету"],["kv","Окно","7 дней"],["kv","Пешком","от площадки"],["kv","Часы","работы"]]},"E1":{"contour":"Оповещение","device":"lock","view":"основной","el":[["notif","Ticketland","Мероприятие завтра","Скидка 10% в ресторанах рядом"]]},"E2":{"contour":"Email или SMS","device":"lock","view":"основной","el":[["notif","Ticketland","Скидка 10% ещё действует","Окно — 7 дней после мероприятия"],["link","Отписаться"]]},"F1":{"contour":"Электронный билет","device":"phone","view":"основной","el":[["hdr","Ваш билет"],["text","Билет на мероприятие"],["barcode"],["offer","Скидка 10% в Bartello"]]},"F2":{"contour":"Приложение-сканер","device":"phone","view":"основной","el":[["hdr","Сканер билетов"],["camera"],["cta","Сканировать"]]},"F3":{"contour":"Приложение-сканер","device":"phone","view":"основной","el":[["hdr","Сканер билетов"],["ok","Скидка 10%"],["cta","Сфотографировать чек"]]},"F4":{"contour":"Приложение-сканер","device":"phone","view":"альтернативный","el":[["hdr","Сканер билетов"],["no","Отказ"],["text","Билет использован, вне окна или возвращён"]]},"F5":{"contour":"Приложение-сканер","device":"phone","view":"основной","el":[["hdr","Сканер билетов"],["ok","Чек сохранён"],["text","Компенсация ресторану зафиксирована"]]},"F6":{"contour":"Приложение-сканер","device":"phone","view":"основной","el":[["hdr","Инструкция и FAQ"],["rows",3],["cta2","Поддержка"]]}},"notes":{"A1":"# Сканер — ресторан подключён\n\n![Подключён](screen:A1)\n\n## Product\n\n### Подключиться без сложностей\nКогда ресторан решил участвовать в акции, хочу **подключиться без брони и тяжёлой интеграции**, чтобы быстрее принимать гостей.\n\nИсточник: ФТ-19, ИТ-10\n\n### Разобраться в акции\nКогда я впервые открываю сканер, хочу **сразу найти инструкцию и поддержку**, чтобы начать без звонков.\n\nИсточник: ИТ-9, ФТ-13\n\n## Design\n\n### Где и когда\nПриложение-сканер, первый запуск после подключения.\n\n### Главное на экране\nПодтверждение «Подключён».\n\nИсточник: ИТ-10\n\n### Инструкция и поддержка\nИнструкция, частые вопросы и контакты поддержки — внутри приложения.\n\nИсточник: ИТ-9\n\n### Шаги подключения\n[УТОЧНИТЬ у Bartello] — шаги и экраны подключения, борда FigJam.\n\nИсточник: ИТ-10\n\n### Платформа\nОтдельное приложение, не обязательно нативное.\n\nИсточник: ИТ-8\n\n## Functions\n\n### Подключение завершено\n**Дано** ресторан подал заявку на участие\n**Когда** подключение завершено\n**Тогда** приложение показывает «Подключён»\n**И** открывает инструкцию и поддержку\n\nИсточник: ИТ-10, ИТ-9\n\n### Путь подключения\n**Дано** ресторан начинает подключение\n**Тогда** [УТОЧНИТЬ у Bartello] — шаги без брони и тяжёлой интеграции\n\nИсточник: ФТ-19\n","B1":"# Страница после оплаты\n\n![Блок акции](screen:B1)\n\n## Product\n\n### Узнать о скидке\nКогда я купил билет на офлайн-мероприятие, хочу **сразу узнать о скидке 10%** в ресторанах рядом, чтобы не пропустить выгоду.\n\nИсточник: ПТ-2\n\n### Увидеть рестораны рядом\nКогда я вижу предложение, хочу **видеть рестораны у площадки своего билета**, чтобы понять, куда идти.\n\nИсточник: ИТ-1, ФТ-3\n\n### Перейти к выбору\nКогда я решил сходить в ресторан, хочу **перейти к выбору**, чтобы найти подходящий рядом с театром.\n\nИсточник: ПТ-3\n\n## Design\n\n### Где и когда\nВитрина, страница после оплаты. Покупка только что подтверждена.\n\n### Главное на экране\nОбещание «вам доступна скидка 10%».\n\nИсточник: ИТ-1\n\n### Полка ресторанов\nРестораны-участники, первыми — у площадки билета.\n\nИсточник: ИТ-1, ФТ-3\n\n### Куда дальше\n«Выбрать ресторан» ведёт к списку всех ресторанов.\n\nИсточник: ИТ-1\n\n### Тексты\nБез склонений названий мероприятий. Проверка: «Королевские игры», «Mamma Mia», «Ленком».\n\nИсточник: НФТ-3\n\n### Айдентика\nФиолетовая айдентика акции, один дизайнер на все блоки.\n\nИсточник: НФТ-4\n\n## Functions\n\n### Офлайн-билет\n**Дано** гость купил билет на офлайн-мероприятие\n**Когда** открывается страница после оплаты\n**Тогда** виден блок «вам доступна скидка 10%»\n**И** полка ресторанов-участников\n\nИсточник: ИТ-1, ФТ-2\n\n### Онлайн-мероприятие\n**Дано** гость купил билет на онлайн-мероприятие\n**Тогда** блока акции нет\n\nИсточник: ФТ-2\n\n### Переход к выбору\n**Когда** гость нажимает «Выбрать ресторан»\n**Тогда** открывается список всех ресторанов\n**И** событие уходит в Метрику\n\nИсточник: ПТ-3, ФТ-2\n\n### Рядом нет ресторанов\n**Дано** у площадки нет ресторанов-участников\n**Тогда** [УТОЧНИТЬ у MRS] — что показывать в полке\n\nИсточник: ФТ-3\n\n### Каталог недоступен\n**Дано** каталог ресторанов не отвечает\n**Когда** открывается страница после оплаты\n**Тогда** [УТОЧНИТЬ у Витрина] — вид страницы без полки\n\nИсточник: ФТ-2, НФТ-1\n\n### Другой город\n**Дано** мероприятие не в Москве и не в Санкт-Петербурге\n**Тогда** [УТОЧНИТЬ у PO] — показывать ли блок\n","C1":"# Письмо с билетом\n\n![Письмо](screen:C1)\n\n## Product\n\n### Увидеть предложение в письме\nКогда я открываю письмо с билетом, хочу **увидеть то же предложение о скидке**, чтобы не пропустить его.\n\nИсточник: ПТ-2, ФТ-5\n\n### Перейти к ресторанам\nКогда я решил выбрать ресторан, хочу **одной кнопкой перейти к акционным ресторанам**.\n\nИсточник: ФТ-5\n\n## Design\n\n### Где и когда\nТранзакционное письмо с билетом, сразу после покупки.\n\n### Главное в письме\nОдин акцентный офер — скидка 10%, в компактной плашке.\n\nИсточник: ИТ-2, ФТ-5\n\n### Второстепенное\n«Забронировать в Bartello» — вторичной кнопкой.\n\nИсточник: ИТ-2\n\n### Мобильный размер\nПисьмо читается на ширине до 600px.\n\nИсточник: ИТ-2\n\n### Тексты\nБез склонений названий мероприятий.\n\nИсточник: НФТ-3\n\n## Functions\n\n### Письмо после покупки\n**Дано** гость купил офлайн-билет\n**Когда** приходит письмо с билетом\n**Тогда** в нём плашка акции с одним офером\n\nИсточник: ФТ-5\n\n### Переход из письма\n**Когда** гость нажимает «Выбрать ресторан»\n**Тогда** открывается страница акционных ресторанов\n**И** клик размечен\n\nИсточник: ФТ-5, ИТ-2\n\n### Письмо не доставлено\n**Дано** письмо не дошло\n**Тогда** [УТОЧНИТЬ у CPO витрины] — повторная отправка или другой канал\n\nИсточник: ФТ-6\n\n### Ресторан добавлен позже\n**Дано** ресторан вошёл в акцию после покупки билета\n**Тогда** [УТОЧНИТЬ у MRS] — актуален ли список в письме\n","D1":"# Все рестораны\n\n![Список](screen:D1)\n\n## Product\n\n### Выбрать ресторан рядом\nКогда я выбираю, куда пойти, хочу **полный список ресторанов-участников с фильтрами**, чтобы быстро выбрать подходящий рядом с театром.\n\nИсточник: ПТ-3\n\n## Design\n\n### Где и когда\nВитрина, раздел «Все рестораны» после перехода из блока акции или письма.\n\n### Главное на экране\nПолный список участников — без обрезки радиусом.\n\nИсточник: ИТ-3\n\n### Порядок\nБлижние и с высоким рейтингом выше, первыми — у площадки билета.\n\nИсточник: ФТ-3\n\n### Фильтры\n- количество персон\n- можно ли с животными\n- средний чек\n- близость к метро\n- тип кухни\n\nИсточник: ИТ-7\n\n### Расположение фильтров\n[УТОЧНИТЬ у Дизайн] — расположение и поведение фильтров на макете.\n\nИсточник: ИТ-7\n\n## Functions\n\n### Полный список\n**Дано** у гостя активный билет\n**Когда** он открывает «Все рестораны»\n**Тогда** видны все участники\n**И** первыми — рестораны у площадки билета\n\nИсточник: ИТ-3, ФТ-3\n\n### Фильтр\n**Когда** гость выбирает фильтр\n**Тогда** список сужается\n**И** событие фильтра уходит в метрики\n\nИсточник: ФТ-11\n\n### Пустой результат\n**Дано** фильтры не оставили ни одного ресторана\n**Тогда** [УТОЧНИТЬ у PO] — пустое состояние и подсказка\n\nИсточник: ФТ-11\n\n### Несколько активных билетов\n**Дано** у гостя билеты на разные площадки\n**Тогда** [УТОЧНИТЬ у PO] — какие рестораны первыми\n\nИсточник: ФТ-3\n\n### Нет рейтинга\n**Дано** у ресторана нет рейтинга\n**Тогда** [УТОЧНИТЬ у MRS] — его место в списке\n\nИсточник: НФТ-2\n","D2":"# Карточка ресторана\n\n![Карточка](screen:D2)\n\n## Product\n\n### Решить, идти ли\nКогда я смотрю ресторан, хочу **видеть скидку, путь пешком и часы работы**, чтобы решить, идти ли.\n\nИсточник: ИТ-4\n\n## Design\n\n### Где и когда\nВитрина, карточка ресторана из списка.\n\n### Главное на экране\nЗаметный блок акции — виден без скролла.\n\nИсточник: ИТ-4\n\n### Путь пешком\nВремя в пути пешком от площадки последнего билета.\n\nИсточник: ИТ-4\n\n### Часы работы\nЧасы работы у каждого ресторана-участника.\n\nИсточник: ИТ-4\n\n## Functions\n\n### Блок акции\n**Дано** ресторан участвует в акции\n**Когда** гость открывает карточку\n**Тогда** блок акции виден без скролла\n\nИсточник: ИТ-4, ФТ-4\n\n### Путь пешком\n**Дано** у гостя есть билет\n**Когда** открыта карточка ресторана\n**Тогда** время пешком от площадки отличается от картографического не больше чем на 2 минуты\n\nИсточник: ИТ-4\n\n### Нет часов работы\n**Дано** у ресторана нет часов работы в справочнике\n**Тогда** [УТОЧНИТЬ у MRS] — источник и показ\n\nИсточник: ФТ-4\n\n### Ресторан вышел из акции\n**Дано** ресторан вышел из акции после покупки билета\n**Тогда** [УТОЧНИТЬ у Bartello] — что видит гость\n","E1":"# Оповещение накануне\n\n![Оповещение](screen:E1)\n\n## Product\n\n### Не забыть о скидке\nКогда до мероприятия остались сутки, хочу **получить напоминание о скидке**, чтобы зайти в ресторан рядом.\n\nИсточник: ФТ-16\n\n## Design\n\n### Где и когда\nУведомление за 24 часа до мероприятия.\n\nИсточник: ФТ-16\n\n### Главное\n«Мероприятие завтра» и скидка 10% в ресторанах рядом.\n\nИсточник: ИТ-6\n\n### Канал\n[УТОЧНИТЬ у CPO витрины] — каким каналом приходит оповещение.\n\nИсточник: ИТ-6\n\n## Functions\n\n### За сутки до мероприятия\n**Дано** гость купил офлайн-билет\n**Когда** до мероприятия 24 часа\n**Тогда** приходит оповещение о скидке\n\nИсточник: ФТ-16, ИТ-6\n\n### Гость отписан\n**Дано** гость отписался от касаний\n**Тогда** оповещение не приходит\n\nИсточник: ФТ-6\n\n### Нет email или телефона\n**Дано** у гостя нет нужного контакта\n**Тогда** [УТОЧНИТЬ у CPO витрины] — доступный канал\n\nИсточник: ФТ-6\n","E2":"# Напоминание после мероприятия\n\n![Напоминание](screen:E2)\n\n## Product\n\n### Успеть воспользоваться\nКогда мероприятие прошло, хочу **знать, что скидка ещё действует**, чтобы успеть ею воспользоваться.\n\nИсточник: ИТ-6, ФТ-6\n\n## Design\n\n### Где и когда\nПисьмо или SMS в окне 7 дней после мероприятия.\n\nИсточник: ФТ-6\n\n### Главное\n«Скидка 10% ещё действует» и срок — 7 дней после мероприятия.\n\nИсточник: ИТ-6\n\n### Отписка\nСсылка «Отписаться» — отписки соблюдаются.\n\nИсточник: ИТ-6\n\n## Functions\n\n### Напоминание в окне\n**Дано** мероприятие прошло, окно скидки открыто\n**Тогда** приходит хотя бы одно напоминание письмом или SMS\n\nИсточник: ИТ-6\n\n### Скидка уже использована\n**Дано** гость уже получил скидку по этому билету\n**Тогда** [УТОЧНИТЬ у CPO витрины] — прекращаются ли напоминания\n\nИсточник: ФТ-6\n\n### Пересечение с рассылками\n**Дано** у гостя есть и обычные рассылки\n**Тогда** [УТОЧНИТЬ у CPO витрины] — лимит частоты касаний\n\nИсточник: ФТ-6\n","F1":"# Электронный билет в ресторане\n\n![Билет](screen:F1)\n\n## Product\n\n### Получить скидку по билету\nКогда я прихожу в ресторан в течение 7 дней после мероприятия, хочу **просто показать билет**, чтобы получить скидку 10% без брони.\n\nИсточник: ПТ-1\n\n## Design\n\n### Где и когда\nТелефон гостя, в ресторане, перед оплатой.\n\n### Главное на экране\nШтрихкод билета — его сканирует официант.\n\nИсточник: ПТ-1\n\n### Напоминание об акции\nПлашка «Скидка 10% в Bartello».\n\nИсточник: ИТ-1\n\n## Functions\n\n### Билет в окне скидки\n**Дано** после мероприятия прошло не больше 7 дней\n**Когда** гость показывает билет официанту\n**Тогда** официант сканирует штрихкод\n**И** бронь не нужна\n\nИсточник: ПТ-1\n\n### Несколько билетов, один чек\n**Дано** компания пришла с несколькими билетами\n**Тогда** [УТОЧНИТЬ у PO] — одна скидка на чек или по числу билетов\n\nИсточник: ПТ-1\n\n### Билет передан другому\n**Дано** билет показывает не покупатель\n**Тогда** [УТОЧНИТЬ у Bartello] — привязана ли скидка к владельцу\n","F2":"# Сканер — сканирование\n\n![Сканирование](screen:F2)\n\n## Product\n\n### Проверить билет\nКогда гость показал билет, хочу **отсканировать штрихкод**, чтобы проверить его.\n\nИсточник: ПТ-4\n\n## Design\n\n### Где и когда\nТелефон официанта, гость за столом показывает билет.\n\n### Главное на экране\nКамера для штрихкода и кнопка «Сканировать».\n\nИсточник: ИТ-8\n\n## Functions\n\n### Сканирование\n**Когда** официант наводит камеру на штрихкод\n**Тогда** билет уходит на проверку\n\nИсточник: ИТ-8, ФТ-1\n\n### Штрихкод не читается\n**Дано** штрихкод повреждён, это скриншот или блик\n**Тогда** [УТОЧНИТЬ у Bartello] — ручной ввод или отказ\n\nИсточник: ФТ-1\n\n### Нет интернета\n**Дано** у ресторана нет сети\n**Тогда** [УТОЧНИТЬ у Bartello] — работа без сети\n\nИсточник: ФТ-8\n","F3":"# Сканер — результат проверки\n\n![Скидка 10%](screen:F3)\n![Отказ](screen:F4)\n\n## Product\n\n### Понять, давать ли скидку\nКогда я отсканировал билет, хочу **сразу понять, давать ли скидку**, чтобы не спорить с гостем.\n\nИсточник: ФТ-1, ФТ-8\n\n### Видеть причину отказа\nКогда билет не прошёл, хочу **видеть причину**, чтобы объяснить её гостю.\n\nИсточник: ФТ-1\n\n### Перейти к фото чека\nКогда скидка дана, хочу **сразу перейти к фото чека**, чтобы ресторан получил компенсацию.\n\nИсточник: ИТ-8\n\n### Открыть помощь\nКогда я не знаю, что делать, хочу **открыть инструкцию и поддержку**, чтобы не задерживать гостя.\n\nИсточник: ФТ-13\n\n## Design\n\n### Где и когда\nТелефон официанта. Гость за столом, билет только что отсканирован.\n\n### Главное на экране\nСкидка 10% или отказ — без двусмысленности.\n\nИсточник: ИТ-8\n\n### Причина отказа\nПростыми словами: «использован», «вне окна 7 дней», «возвращён».\n\n![Отказ](screen:F4)\n\nИсточник: ФТ-1\n\n### Куда дальше\n- При успехе — фото чека\n- При отказе — инструкция и поддержка\n\nИсточник: ИТ-8, ФТ-13\n\n## Functions\n\n### Действующий билет\n**Дано** билет активен, не использован, мероприятие было не больше 7 дней назад\n**Когда** официант сканирует штрихкод\n**Тогда** экран «Скидка 10%»\n**И** билет помечен «использован»\n\nИсточник: ФТ-1, ИТ-8\n\n### Повторное сканирование\n**Дано** билет уже использован\n**Когда** официант сканирует штрихкод\n**Тогда** отказ с причиной «использован»\n\nИсточник: ФТ-1\n\n### Вне окна 7 дней\n**Дано** мероприятие было больше 7 дней назад\n**Когда** официант сканирует штрихкод\n**Тогда** отказ с понятной причиной\n\nИсточник: ФТ-1\n\n### Билет возвращён\n**Дано** гость вернул билет\n**Когда** официант сканирует штрихкод\n**Тогда** [УТОЧНИТЬ у PO] — остаётся ли скидка\n\nИсточник: ФТ-15\n\n### Мероприятие отменено или перенесено\n**Дано** мероприятие отменили или перенесли\n**Тогда** [УТОЧНИТЬ у Bartello] — работает ли билет\n\nИсточник: ФТ-15\n\n### Сервис проверки недоступен\n**Дано** сервис проверки билетов не отвечает\n**Тогда** [УТОЧНИТЬ у Bartello] — скидка вручную и компенсация\n\nИсточник: ФТ-1, НФТ-1\n","F5":"# Сканер — фото чека\n\n![Чек сохранён](screen:F5)\n\n## Product\n\n### Получить компенсацию\nКогда скидка дана и гость оплатил, хочу **сфотографировать чек**, чтобы ресторан получил компенсацию.\n\nИсточник: ИТ-8, ФТ-8\n\n## Design\n\n### Где и когда\nТелефон официанта, после оплаты счёта.\n\n### Главное на экране\nПодтверждение «Чек сохранён» — компенсация зафиксирована.\n\nИсточник: ИТ-8\n\n## Functions\n\n### Фото чека\n**Дано** скидка по билету дана\n**Когда** официант фотографирует чек\n**Тогда** компенсация ресторану зафиксирована\n**И** Ticketland получает уведомление о списании\n\nИсточник: ИТ-8, ФТ-14\n\n### Фото нечитаемо\n**Дано** чек не сфотографирован или фото нечитаемо\n**Тогда** [УТОЧНИТЬ у Bartello] — блокирует ли это компенсацию\n\nИсточник: ФТ-8\n\n### Лимит компенсаций\n**Дано** ресторан достиг лимита компенсаций\n**Тогда** [УТОЧНИТЬ у Bartello] — есть ли лимит и что дальше\n\nИсточник: ФТ-14\n","F6":"# Сканер — инструкция и поддержка\n\n![Инструкция и FAQ](screen:F6)\n\n## Product\n\n### Найти помощь\nКогда я не знаю, что делать, хочу **найти инструкцию, частые вопросы и поддержку в приложении**, чтобы выдать скидку без ошибок.\n\nИсточник: ПТ-4, ФТ-13\n\n## Design\n\n### Где и когда\nПриложение-сканер, раздел помощи — из отказа или в любой момент.\n\n### Инструкция\nКраткая инструкция, как работает акция.\n\nИсточник: ИТ-9\n\n### Частые вопросы\nНабор популярных вопросов внутри приложения.\n\nИсточник: ИТ-9\n\n### Контакты поддержки\nНомер телефона и почта.\n\nИсточник: ИТ-9\n\n### Инструкция для ресторанов\nОтдельным материалом, вне приложения.\n\nИсточник: ИТ-9\n\n## Functions\n\n### Открыть помощь\n**Когда** официант открывает помощь\n**Тогда** видны инструкция, частые вопросы и контакты поддержки\n\nИсточник: ФТ-13\n\n### Контакты\n**Дано** официанту нужна поддержка\n**Тогда** [УТОЧНИТЬ у PO] — номер и почта поддержки\n\nИсточник: ФТ-13\n"},"briefs":{"0.1":{"ASIS":"Из ~300 заявок ресторанов подключено 18: интеграция тяжёлая, механика привязана к брони.","GAP":"Ресторан не может подключиться без брони и интеграции — сеть участников не растёт, гостю некуда идти.","TOBE":"Ресторан подключается без брони и тяжёлой интеграции и сразу получает приложение-сканер, инструкцию и контакты поддержки.","HowToDemo":"1. Ресторан подаёт заявку на участие\n2. Проходит шаги подключения — без брони и интеграции\n3. Получает доступ к приложению-сканеру, инструкцию и контакты поддержки\n4. Появляется в каталоге участников","Чеклист приемки":"- [ ] Подключение проходит без брони и тяжёлой интеграции\n- [ ] Ресторан получает приложение-сканер, инструкцию и контакты поддержки\n- [ ] Подключённый ресторан виден в каталоге участников\n- [ ] Шаги подключения согласованы с бордой FigJam","Дополнительно":"- Шаги и экраны подключения — борда FigJam"},"0.2":{"ASIS":"Список ресторанов обрезан радиусом; часов работы и рейтинга у части участников нет.","GAP":"Полка и список не могут показать всех участников с рейтингом и часами работы.","TOBE":"Каталог содержит всех ресторанов-участников с рейтингом и часами работы и отдаётся полке, списку и карточке.","HowToDemo":"1. Bartello передаёт список ресторанов-участников\n2. Каталог загружает рейтинги из справочника\n3. Открываю «Все рестораны» — вижу всех участников с рейтингом и часами работы","Чеклист приемки":"- [ ] В каталоге все рестораны-участники\n- [ ] Часы работы у 100% участников\n- [ ] Рейтинг — статичный справочник, обновление не реже раза в квартал\n- [ ] Обращений к API карт без договора нет","Дополнительно":"- Рейтинги — выгрузка Яндекс.Карт, без API"},"0.4":{"ASIS":"Касаний в окне скидки нет; частота и каналы триггерных касаний не пересматривались.","GAP":"Без правил частоты новые касания рискуют вызвать отписки и жалобы.","TOBE":"Частота и каналы касаний пересмотрены, акционные касания встроены в общий лимит, отписки соблюдаются.","HowToDemo":"1. Маркетинг утверждает частоту и каналы касаний\n2. Гость с билетом получает оповещение и напоминание по правилам\n3. Отписываюсь — касания больше не приходят","Чеклист приемки":"- [ ] Частота и каналы касаний утверждены\n- [ ] Отписки соблюдаются\n- [ ] Правила переданы командам касаний 4.2 и 5.2"},"0.5":{"ASIS":"Блоки акции в разных точках выглядят по-разному, единого макета нет.","GAP":"Гость не узнаёт акцию в разных точках контакта.","TOBE":"Все блоки акции — страница после оплаты, письмо, карточка, сканер — в одной фиолетовой айдентике от одного дизайнера.","HowToDemo":"1. Открываю макеты всех блоков акции\n2. Сверяю: страница после оплаты, письмо, список, карточка, сканер — один стиль\n3. Сверяю экраны с бордой FigJam","Чеклист приемки":"- [ ] Макеты всех блоков ИТ-1…ИТ-7 готовы\n- [ ] Один дизайнер, фиолетовая айдентика\n- [ ] Имя дизайнера зафиксировано до старта вёрстки","Дополнительно":"- Борда FigJam «Спецпроект Ticketland»"},"1.2":{"ASIS":"На странице после покупки нет акционного блока — в прошлом запуске о скидке узнали меньше 1% гостей.","GAP":"Гость не узнаёт о скидке в момент покупки.","TOBE":"После покупки офлайн-билета страница показывает блок «вам доступна скидка 10%» и полку ресторанов-участников.","HowToDemo":"1. Покупаю билет на офлайн-мероприятие\n2. Страница после оплаты показывает блок акции и полку ресторанов\n3. Перехожу в «Все рестораны»","Чеклист приемки":"- [ ] Блок акции и полка видны после покупки офлайн-билета\n- [ ] Для онлайн-мероприятий блока нет\n- [ ] События блока размечены в Метрике\n- [ ] Тексты без склонений: проверено на «Королевские игры», «Mamma Mia», «Ленком»\n- [ ] Фиолетовая айдентика","Дополнительно":"- Требования к экрану — screens/B1.md"},"1.3":{"ASIS":"Список ресторанов обрезан радиусом и не учитывает площадку билета.","GAP":"Гость видит случайные рестораны, а не рядом со своим театром.","TOBE":"Полка показывает первыми рестораны у площадки активного билета, дальше — ближние и с высоким рейтингом.","HowToDemo":"1. Покупаю билет на мероприятие на конкретной площадке\n2. На полке первыми — рестораны у этой площадки\n3. Рядом — ближние и с высоким рейтингом","Чеклист приемки":"- [ ] Первыми — рестораны у площадки активного билета\n- [ ] Ранжирование: ближние × высокий рейтинг\n- [ ] Рейтинг — статичный справочник, без API карт"},"2.2":{"ASIS":"В письме плашка «забронировать в Bartello» без акцента на скидке.","GAP":"Гость, пропустивший блок на странице после оплаты, не узнаёт о скидке из письма.","TOBE":"Письмо с билетом несёт компактную плашку с одним акцентным офером — скидка 10%; «забронировать в Bartello» — вторичным.","HowToDemo":"1. Открываю письмо с билетом\n2. Вижу компактную плашку с одним офером — скидка 10%\n3. Нажимаю «Выбрать ресторан» — открывается страница акционных ресторанов","Чеклист приемки":"- [ ] Один акцентный офер — скидка 10%\n- [ ] «Забронировать в Bartello» — вторичное действие\n- [ ] Клик ведёт на страницу акционных ресторанов\n- [ ] Рендер до 600px на мобильных\n- [ ] Клики по позициям размечены","Дополнительно":"- Требования к экрану — screens/C1.md"},"3.2":{"ASIS":"Список обрезан радиусом, фильтров нет.","GAP":"Гость не может быстро найти ресторан под свою компанию рядом с театром.","TOBE":"«Все рестораны» показывает полный список участников с фильтрами: персоны, животные, средний чек, метро, кухня.","HowToDemo":"1. Открываю «Все рестораны» — вижу полный список\n2. Фильтрую по персонам, животным, чеку, метро, кухне\n3. Открываю карточку ресторана","Чеклист приемки":"- [ ] Полный список, не обрезан радиусом\n- [ ] Работают все пять фильтров\n- [ ] Метрики по каждому фильтру\n- [ ] Пустой результат фильтров согласован с PO","Дополнительно":"- Требования к экрану — screens/D1.md"},"3.3":{"ASIS":"Список обрезан радиусом.","GAP":"Порядок ресторанов не помогает выбрать ближний и хороший.","TOBE":"Ранжирование: первыми — площадка активного билета, дальше ближние и с высоким рейтингом; фильтры сужают выдачу.","HowToDemo":"1. Открываю «Все рестораны» с активным билетом\n2. Первыми — рестораны у площадки билета\n3. Дальше — ближние и с высоким рейтингом","Чеклист приемки":"- [ ] Полный список без обрезки радиусом\n- [ ] Площадка активного билета — выше остальных\n- [ ] Каталог выдерживает 300 ресторанов","Дополнительно":"- Персонализация выдачи — вне квартала без решения PO"},"3.4":{"ASIS":"В карточке ресторана нет блока акции.","GAP":"Гость не видит в карточке скидку, путь от театра и часы работы — решение идти не принимается.","TOBE":"Карточка показывает заметный блок акции без скролла, время пешком от площадки последнего билета и часы работы.","HowToDemo":"1. Открываю карточку ресторана из списка\n2. Вижу блок акции без скролла\n3. Вижу время пешком от площадки и часы работы","Чеклист приемки":"- [ ] Блок акции виден без скролла\n- [ ] Время пешком отличается от картографического не больше чем на 2 минуты\n- [ ] Часы работы у 100% участников\n- [ ] Вебвизор и метки источника трафика на странице","Дополнительно":"- Требования к экрану — screens/D2.md"},"3.5":{"ASIS":"[УТОЧНИТЬ у PO] — ASIS раздела «Рестораны» в БФТ не описан.","GAP":"Из существующего раздела «Рестораны» нет входа в акцию.","TOBE":"В разделе «Рестораны» есть мини-полка спецпроекта, она ведёт к акционным ресторанам; посадочная для лидов работает.","HowToDemo":"1. Открываю раздел «Рестораны»\n2. Вижу мини-полку спецпроекта\n3. Перехожу к акционным ресторанам","Чеклист приемки":"- [ ] Вход в акционные рестораны виден из раздела\n- [ ] Посадочная для лидов работает"},"4.2":{"ASIS":"Касаний до мероприятия нет.","GAP":"Гость забывает о скидке к дню мероприятия.","TOBE":"За 24 часа до мероприятия гость получает оповещение об акции; отписки соблюдаются.","HowToDemo":"1. Покупаю билет на офлайн-мероприятие\n2. За 24 часа до мероприятия приходит оповещение об акции\n3. Отписываюсь — оповещения больше не приходят","Чеклист приемки":"- [ ] Оповещение за 24 часа до мероприятия\n- [ ] Частота и каналы — по правилам касаний 0.4\n- [ ] Отписки соблюдаются","Дополнительно":"- Требования к экрану — screens/E1.md"},"5.2":{"ASIS":"Касаний после мероприятия нет; есть ли сейчас email после мероприятия — [УТОЧНИТЬ у CPO витрины].","GAP":"Гость не помнит, что скидка действует ещё 7 дней.","TOBE":"В окне 7 дней после мероприятия приходит хотя бы одно напоминание письмом или SMS; отписки соблюдаются.","HowToDemo":"1. Мероприятие прошло\n2. В окне скидки приходит письмо или SMS — минимум одно касание\n3. Отписываюсь — касания больше не приходят","Чеклист приемки":"- [ ] Не меньше одного напоминания в окне 7 дней\n- [ ] Отписки соблюдаются\n- [ ] SMS и коммуникации Bartello согласованы","Дополнительно":"- Требования к экрану — screens/E2.md"},"5.4":{"ASIS":"[УТОЧНИТЬ у владельцев приложений] — поддерживают ли приложения Ticketland и TicketsCloud push.","GAP":"Push-канал для напоминаний о скидке не используется.","TOBE":"Если приложения поддерживают push, гость получает push о скидке до и после мероприятия.","HowToDemo":"1. Устанавливаю приложение Ticketland с включёнными уведомлениями\n2. До мероприятия приходит push о скидке\n3. После мероприятия — push в окне скидки","Чеклист приемки":"- [ ] Решение о push принято владельцами приложений\n- [ ] Push приходит до и после мероприятия, если канал есть"},"6.2":{"ASIS":"Приложения у официанта нет, скидка привязана к брони.","GAP":"Официант не может проверить билет и выдать скидку без брони — возникают ошибки и споры.","TOBE":"Приложение-сканер: скан штрихкода → результат «скидка 10%» или отказ с причиной; внутри — инструкция, FAQ и поддержка.","HowToDemo":"1. Гость показывает билет\n2. Официант сканирует штрихкод — приложение сразу отвечает\n3. Повторное сканирование — отказ с понятной причиной\n4. Из отказа официант открывает инструкцию и поддержку","Чеклист приемки":"- [ ] Шаги сценария 4 проходят на бете приложения\n- [ ] Отказ — с понятной причиной\n- [ ] Инструкция, FAQ и контакты поддержки внутри приложения\n- [ ] Приложение не обязательно нативное","Дополнительно":"- Требования к экранам — screens/F2.md, screens/F3.md, screens/F6.md\n- Владелец разработки и формат приложения — у Bartello"},"6.3":{"ASIS":"Механика скидки привязана к брони, проверки билета нет.","GAP":"Без проверки одна покупка может дать несколько скидок или ни одной.","TOBE":"Проверка по штрихкоду: билет активен, не использован, мероприятие было не больше 7 дней назад; успех помечает билет «использован», отказ — с причиной.","HowToDemo":"1. Сканирую действующий билет — проверка пройдена, билет «использован»\n2. Сканирую тот же билет снова — отказ «использован»\n3. Сканирую билет вне окна 7 дней — отказ с причиной","Чеклист приемки":"- [ ] Проверка: активен, не использован, не больше 7 дней\n- [ ] Успех помечает билет «использован»\n- [ ] Отказ — с понятной причиной\n- [ ] Выдерживает пик старта: 300 ресторанов"},"7.2":{"ASIS":"Скидка давалась только по брони.","GAP":"Гость с билетом без брони не получает обещанную скидку.","TOBE":"Официант     else if (t.device === "mail") { y = 12; frame = `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="10" fill="#fff" stroke="#2b2b2b" stroke-width="1.5"/>` }
    else if (t.device === "lock") { y = 78; frame = `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="22" fill="#e6e2db" stroke="#2b2b2b" stroke-width="1.5"/><rect x="${W / 2 - 20}" y="7" width="40" height="7" rx="3.5" fill="#2b2b2b"/>` + T(W / 2, 56, "09:41", 30, 300, "#555", "middle") }
    else { y = 24; frame = `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="22" fill="#fff" stroke="#2b2b2b" stroke-width="1.5"/><rect x="${W / 2 - 20}" y="7" width="40" height="7" rx="3.5" fill="#2b2b2b"/>` }

      else if (k === "hdr") { const ok = it[1].startsWith("✓ "); out += ok ? `<circle cx="${P + 7}" cy="${y + 7}" r="7" fill="${ink}"/><path d="M${P + 3.5},${y + 7} l2.5,2.5 l4.5,-5" fill="none" stroke="#fff" stroke-width="1.8"/>` + T(P + 19, y + 11.5, it[1].slice(2), 12, 700) : T(P, y + 11.5, it[1], 12, 700); y += 22 }

      else if (k === "cta" || k === "cta2") { const fs = it[1].length > 16 ? 9.5 : 11; out += `<rect x="${P}" y="${y}" width="${IW}" height="26" rx="13" fill="${k === "cta" ? ink : "#fff"}" stroke="${ink}" stroke-width="1.2"/>` + T(W / 2, y + 17, it[1], fs, 700, k === "cta" ? "#fff" : ink, "middle"); y += 32 }
      else if (k === "link") { out += T(P, y + 12, it[1], 11, 700, ink) + `<line x1="${P}" y1="${y + 15}" x2="${P + Math.min(IW, it[1].length * 6)}" y2="${y + 15}" stroke="${ink}"/>`; y += 22 }
      else if (k === "tiles") { const tw = (IW - 8) / 2; [0, 1].forEach(i => { const x = P + i * (tw + 8); out += `<rect x="${x}" y="${y}" width="${tw}" height="58" rx="7" fill="#fff" stroke="#d6d2ca"/><rect x="${x + 5}" y="${y + 5}" width="${tw - 10}" height="24" rx="4" fill="#ece9e3"/><rect x="${x + 5}" y="${y + 35}" width="${tw - 22}" height="6" rx="3" fill="#cfcac0"/><rect x="${x + 5}" y="${y + 46}" width="${tw - 34}" height="5" rx="2.5" fill="#e3dfd8"/><rect x="${x + tw - 27}" y="${y + 8}" width="22" height="13" rx="6.5" fill="${OF}"/>` }); y += 66 }
      else if (k === "rows" || k === "rowsOffer") { for (let i = 0; i < it[1]; i++) { out += `<rect x="${P}" y="${y}" width="26" height="26" rx="5" fill="#ece9e3"/><rect x="${P + 33}" y="${y + 5}" width="58" height="6" rx="3" fill="#cfcac0"/><rect x="${P + 33}" y="${y + 16}" width="40" height="5" rx="2.5" fill="#e3dfd8"/>`; if (k === "rowsOffer") out += `<rect x="${W - P - 28}" y="${y + 6}" width="28" height="14" rx="7" fill="${OF}"/>`; y += 34 } }

      else if (k === "kv") { out += T(P, y + 12, it[1], 10.5, 400, g) + T(W - P, y + 12, it[2], 11, 700, ink, "end") + `<line x1="${P}" y1="${y + 19}" x2="${W - P}" y2="${y + 19}" stroke="#eee"/>`; y += 24 }
      else if (k === "img") { out += `<rect x="${P}" y="${y}" width="${IW}" height="56" rx="7" fill="#ece9e3"/><path d="M${P + 20},${y + 44} l18,-20 l14,14 l10,-9 l18,15z" fill="#d6d1c8"/>`; y += 64 }
      else if (k === "camera") { out += `<rect x="${P}" y="${y}" width="${IW}" height="112" rx="8" fill="#2b2b2b"/>`;[[P + 10, y + 10, 1, 1], [W - P - 10, y + 10, -1, 1], [P + 10, y + 102, 1, -1], [W - P - 10, y + 102, -1, -1]].forEach(([x, yy, dx, dy]) => out += `<path d="M${x},${yy + 14 * dy} V${yy} H${x + 14 * dx}" fill="none" stroke="#fff" stroke-width="2.4"/>`); for (let i = 0; i < 20; i++) out += `<rect x="${P + 28 + i * 4.3}" y="${y + 38}" width="${i % 3 ? 1.4 : 2.8}" height="36" fill="#fff"/>`; y += 120 }
      else if (k === "ok" || k === "no") { const cx = W / 2, cy = y + 30, col = k === "ok" ? "#2f6b2a" : "#c0392b"; out += `<circle cx="${cx}" cy="${cy}" r="24" fill="${col}"/>` + (k === "ok" ? `<path d="M${cx - 11},${cy} l8,8 l14,-15" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>` : `<path d="M${cx - 9},${cy - 9} l18,18 M${cx + 9},${cy - 9} l-18,18" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>`); y += 64; out += T(cx, y + 6, it[1], 14, 800, k === "ok" ? ink : "#c0392b", "middle"); y += 22 }
      else if (k === "barcode") { out += `<rect x="${P}" y="${y}" width="${IW}" height="70" rx="8" fill="#fff" stroke="#d6d2ca"/>`; for (let i = 0; i < 24; i++) out += `<rect x="${P + 14 + i * 4.6}" y="${y + 12}" width="${i % 3 ? 1.5 : 3}" height="46" fill="${ink}"/>`; y += 80 }
      else if (k === "notif") { const tl = wrapT(it[2], 17), ls = wrapT(it[3], 20), h = 34 + tl.length * 15 + ls.length * 13; out += `<rect x="${P - 3}" y="${y}" width="${IW + 6}" height="${h}" rx="12" fill="#fff"/><rect x="${P + 5}" y="${y + 8}" width="16" height="16" rx="4" fill="${OF}"/>` + T(P + 26, y + 20, it[1], 9.5, 600, g); tl.forEach((l, i) => out += T(P + 5, y + 42 + i * 15, l, 11.5, 800)); ls.forEach((l, i) => out += T(P + 5, y + 42 + tl.length * 15 + i * 13, l, 10.5, 400, "#444")); y += h + 10 }
    }
    const alt = t.view === "альтернативный" ? `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="${t.device === "web" || t.device === "mail" ? 10 : 22}" fill="none" stroke="#c0392b" stroke-width="2.2"/>` : "";
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${frame}${out}${alt}</svg>`;
  }
  return { esc, wrapT, ICON, contourIcon, chip, mockSVG };
