<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blueprint bartello-restart v7</title>
<style>
:root{--ink:#1c1c1c;--muted:#6b6b6b;--red:#c0392b;--bg:#f6f4f0;--band:#efede8;--rule:#cfcac0;--story:#2f6b2a;--storybg:#eef3ea;
--vit:#0f8b8d;--mrs:#8a5a2b;--offer:#6b3fd4;--gds:#2563c9;--bar:#d06a12;--mkt:#c2338a;--des:#3f8a2a;--ext:#8a8a8a}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.45 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:18px 16px 6px;max-width:1500px;margin:0 auto}
h1{font-size:21px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 10px;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:12.5px;padding:0 16px 12px;max-width:1500px;margin:0 auto}
.legend .sw{display:inline-block;width:22px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:2px solid}
.legend .t{font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin-right:4px}
.legend .grp{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.dot{position:absolute;top:-6px;right:-6px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid #fff;color:#fff;font-size:9px;font-weight:800;line-height:10px;text-align:center;z-index:3}
.dot.inl{position:static;display:inline-block;vertical-align:-2px}
/* холст */
.wrap{overflow:auto;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--bg)}
.grid{position:relative;display:grid;grid-template-columns:150px repeat(7,max-content)}
.grid>div{padding:18px 16px;min-height:60px}
.sh{position:sticky;top:0;z-index:4;background:var(--bg);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--rule);min-width:150px}
.ln{position:sticky;left:0;z-index:5;font-weight:700;font-size:13.5px;background:inherit}.ln small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.r1{background:#fff}.r2{background:var(--band)}.rg{background:var(--storybg)}
.line{border-top:1.5px dashed var(--ink)!important}
.line-lbl{display:block;font-weight:400;font-style:italic;color:var(--muted);font-size:10.5px;margin-top:-12px;margin-bottom:8px}
.cell{display:flex;gap:64px;align-items:flex-start}
/* секция истории */
.sec{position:relative;background:#fff;border:1.8px solid var(--story);border-radius:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;display:block;min-width:250px;max-width:360px}
.sec:hover,.sec:focus-visible,.fn:hover,.fn:focus-visible{box-shadow:0 4px 16px rgba(0,0,0,.16);outline:none}
.sec .beat{background:var(--story);color:#fff;font-size:10px;font-weight:800;letter-spacing:.7px;padding:4px 10px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between}
.sec .line1{font-size:14px;font-weight:700;line-height:1.3;padding:8px 12px 0}
.sec .thumbs{display:flex;gap:10px;padding:10px 12px 4px;align-items:flex-end}
.sec .thumb{display:flex;flex-direction:column;align-items:center;gap:3px;width:86px}
.sec .thumb svg{width:86px;height:auto;display:block}
.sec .thumb span{font-size:10px;color:var(--muted);text-align:center;line-height:1.2}
.sec .meta{font-size:11px;color:var(--muted);padding:4px 12px 10px;display:flex;gap:10px;flex-wrap:wrap}
.sec .meta b{color:var(--red);font-weight:700}
.sec .open{font-size:11px;font-weight:700;color:var(--story);padding:0 12px 10px}
.tale{max-width:250px;overflow-wrap:anywhere;background:#fff;border:1.4px dashed var(--story);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.4}
.tale .beat{font-size:10px;font-weight:800;letter-spacing:.7px;color:var(--story);margin-bottom:4px}
.tale .src{font-size:10.5px;color:var(--muted);margin-top:6px}
/* лента истории через экраны: карточка шага = картинка · контур · заголовок · пояснение */
.sf{position:relative;background:#fff;border-radius:18px;padding:12px 12px 16px;box-sizing:border-box;box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(40,60,30,.07);cursor:pointer;transition:box-shadow .15s,transform .15s}
.sf:hover{box-shadow:0 2px 4px rgba(0,0,0,.08),0 12px 28px rgba(40,60,30,.14);transform:translateY(-2px)}
.sf .stepn{position:absolute;top:-10px;left:-10px;width:26px;height:26px;border-radius:50%;background:var(--story);color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--storybg);z-index:3}
.sfr{display:flex;gap:14px;justify-content:center;background:#f3f1ec;border-radius:12px;padding:14px}
.ctr{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:11.5px;font-weight:650;color:#3a3a3a;border:1px solid #e3dfd6;border-radius:999px;padding:3px 10px 3px 7px;background:#faf9f6}
.ctr svg{width:14px;height:14px;flex:none;stroke:#3a3a3a;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sf .ttl{display:block;font-size:16px;font-weight:750;line-height:1.25;margin:9px 2px 4px;color:var(--ink)}
.sf .txt{margin:0 2px;font-size:13.5px;line-height:1.45;color:#5a5a5a}
.tpx{position:relative;width:170px;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;display:block}
.tpx svg{width:170px;height:auto;display:block;transition:filter .15s}.tpx:hover svg,.tpx:focus-visible svg{filter:drop-shadow(0 8px 14px rgba(0,0,0,.18))}.tpx:focus-visible{outline:none}
.tpx .dot{top:6px;right:-5px}
.band{background:#fff;border:1px dashed var(--story);border-radius:14px;padding:12px 16px;margin-top:100px;position:relative;z-index:2}
/* строки истории */
.sc2{position:relative;width:240px;background:#fff;border:1px solid #d9e4d4;border-radius:14px;padding:12px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:block}
.sc2:hover,.sc2:focus-visible{box-shadow:0 6px 16px rgba(0,0,0,.12);outline:none}
.sc2 .n2{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--story);text-transform:uppercase}
.sc2 .h2{font-size:15.5px;font-weight:800;line-height:1.25;margin:4px 0 6px}
.sc2 .say2{font-size:13px;line-height:1.45;color:#2b2b2b}
.sc2 .bf{font-size:12px;color:#8a8378;margin-top:8px;line-height:1.35}.sc2 .bf b{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;border:1px solid #d6d0c4;border-radius:5px;padding:0 5px;margin-right:5px;color:#8a8378}
.sc2 .alt2{font-size:12px;color:#555;background:#f3f0ea;border-radius:8px;padding:6px 8px;margin-top:8px}
.sc2.hero,.sc2.end{background:#f4faf1;border-color:var(--story)}.sc2 .bign{font-size:34px;font-weight:900;line-height:1;margin:6px 0 4px}.sc2.end .bign{color:var(--story)}
.sc2.wide{width:auto;max-width:none}
.rgrid{display:grid;grid-template-columns:repeat(2,220px);gap:14px 28px}.rgrid .sc2{width:220px}
.rg2{background:#f3f7f0}
/* режим показа истории */
.show{position:fixed;inset:0;background:#faf8f4;z-index:10;display:none;flex-direction:column}
body.showing .show{display:flex}body.showing{overflow:hidden}
.show .sbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #e7e2d9;font-size:14px;font-weight:700;flex-wrap:wrap}
.show .sbar .x{font:inherit;border:0;background:none;font-size:26px;cursor:pointer;color:#6b6b6b;line-height:1}
.show .who{display:inline-flex;background:#efebe3;border-radius:999px;padding:3px}
.show .who button{font:inherit;font-size:13px;font-weight:700;border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;color:#6b6b6b}
.show .who button.on{background:#fff;color:#1f1f1f;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.show .stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:10px 20px}
.show .scene{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:36px;align-items:center;max-width:1000px;width:100%}
.show .vis{display:flex;gap:18px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.show .vis .ph,.show .vis .ill{width:min(210px,42vw)}.show .vis .ph svg,.show .vis .ill svg{width:100%;height:auto;display:block}.show .vis .ph svg{filter:drop-shadow(0 10px 18px rgba(0,0,0,.12))}
.show .vis .ph small{display:block;text-align:center;font-size:12px;color:#6b6b6b;margin-top:8px}.show .vis.two .ph{width:min(180px,40vw)}
.show .n{font-size:13px;font-weight:800;letter-spacing:1px;color:#6b6b6b;text-transform:uppercase}
.show h2{font-size:28px;line-height:1.2;margin:6px 0 12px;font-weight:800}
.show .say{font-size:19px;line-height:1.5;margin:0}
.show .before{margin-top:16px;font-size:15px;color:#8a8378;display:flex;gap:10px;align-items:baseline}
.show .before b{flex:none;font-size:11px;letter-spacing:.8px;text-transform:uppercase;border:1px solid #d6d0c4;border-radius:6px;padding:1px 7px}
.show .alt{margin-top:12px;font-size:15px;color:#444;background:#f3f0ea;border-radius:10px;padding:8px 12px}
.show .big{font-size:64px;font-weight:900;line-height:1;letter-spacing:-1px}.show .end h2{color:var(--story)}
.show .snav{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid #e7e2d9;gap:12px}
.show .snav button{font:inherit;font-size:15px;font-weight:700;border:1px solid #e7e2d9;background:#fff;border-radius:999px;padding:10px 18px;cursor:pointer}
.show .snav button:disabled{opacity:.35;cursor:default}
.show .dots{display:flex;gap:6px}.show .dots i{width:8px;height:8px;border-radius:50%;background:#d6d0c4}.show .dots i.on{background:#1f1f1f}
@media(max-width:760px){.show .scene{grid-template-columns:1fr;gap:16px}.show h2{font-size:23px}.show .say{font-size:17px}}
.playbtn{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:999px;padding:8px 16px;background:#1f1f1f;color:#fff;cursor:pointer;margin-top:6px}
/* верхний слой: плёнка точек касания */
.tale2{width:200px;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.4;background:#fff;border:1.4px solid #d8d4cc}
.tale2 .k{font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--muted);margin-bottom:6px}
.tale2 .big{font-size:22px;font-weight:800;line-height:1.1;margin-bottom:4px}
.tale2.after{border-color:var(--story);background:#f4faf1}.tale2.after .big{color:var(--story)}
.tale2 .src{font-size:10.5px;color:var(--muted);margin-top:8px}
.sec2{position:relative;background:#fff;border-radius:16px;padding:12px 14px 12px;border:1px solid #dcd8d0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sec2 .sh2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec2 .beat2{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--story)}
.sec2 .time{font-size:11px;font-weight:600;background:#f1efea;border-radius:10px;padding:2px 8px;color:#444}
.sec2 .line2{font-size:15px;font-weight:700;line-height:1.3;margin:6px 0 12px;max-width:520px}
.sec2 .open2{border:0;background:none;font:inherit;font-size:12px;font-weight:700;color:var(--story);cursor:pointer;padding:6px 0 0}
.sec2 .open2:hover{text-decoration:underline}
.tps{display:flex;align-items:flex-start;gap:0}
.tps .arr{width:26px;flex:none;align-self:flex-start;margin-top:150px;height:2px;background:#9a958c;position:relative}
.tps .arr::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid #9a958c;border-right:0}
.stackv{display:flex;flex-direction:column;gap:14px;align-items:center}
.tp{position:relative;width:150px;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;display:block}
.tp:hover .tpf svg,.tp:focus-visible .tpf svg{filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}.tp:focus-visible{outline:none}
.tp .tph{display:flex;align-items:center;gap:6px;margin-bottom:6px;min-height:20px}
.tp .num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.tp.alt .num{background:var(--red)}
.tp .ch{font-size:10.5px;font-weight:700;color:#444;line-height:1.15}.tp .ch small{display:block;font-weight:500;color:var(--muted);font-size:10px}
.tp .tpf svg{width:150px;height:auto;display:block;transition:filter .15s}
.tp .cap{font-size:12px;font-weight:600;line-height:1.3;margin-top:7px}
.tp .own{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);margin-top:4px}
.tp .own i{display:inline-block;width:14px;height:4px;border-radius:2px;background:var(--c)}
.tp .own i.u{background:none;border:1.5px dashed var(--red);height:6px}
.tp.small{width:96px}.tp.small .tpf svg{width:96px}.tp.small .cap{font-size:11px}
.tp .dot{top:22px;right:-5px}
.tlegend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12px}
.tlegend .ofr{display:inline-block;width:22px;height:12px;border-radius:3px;background:var(--offer);vertical-align:-2px;margin-right:5px}
.hl{animation:hl 1.6s ease 1}@keyframes hl{0%,60%{box-shadow:0 0 0 4px var(--offer)}100%{box-shadow:0 0 0 0 transparent}}
@media(max-width:600px){.grid{grid-template-columns:96px repeat(7,max-content)}.grid>.sh:first-child{min-width:0}.ln{font-size:12px}.ln small{font-size:10px}}
/* функция */
.fn{position:relative;width:210px;background:#fff;border:1.6px solid var(--c);border-radius:8px;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;display:block}
.fn.unk{border-style:dashed}
.fn .hd{background:var(--c);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.6px;padding:3px 8px;display:flex;justify-content:space-between;border-radius:6px 6px 0 0}
.unk .hd{background:#fbe3e0!important;color:var(--red)!important}
.fn .bd{padding:7px 9px 8px}.fn .tt{font-size:13.5px;font-weight:700;line-height:1.25}
.fn .why{font-size:12px;line-height:1.35;margin-top:4px}
.fn .io{font-size:11.5px;color:var(--muted);margin-top:6px;padding-top:5px;border-top:1px solid #ece9e3}.fn .io b{color:var(--ink);font-weight:600}
.pill{display:inline-block;font-size:9px;font-weight:700;border:1.2px solid var(--ink);border-radius:8px;padding:0 6px;line-height:14px;margin-top:7px}
svg.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:1}
.grid .fn,.grid .sec,.grid .tale{z-index:2;position:relative}
.lbl{font-size:10.5px}
/* детальная страница */
.page{position:fixed;inset:0;background:#fff;overflow-y:auto;z-index:7;display:none}
body.page-open .page{display:block}body.page-open{overflow:hidden}
.pbar{position:sticky;top:0;background:#fff;border-bottom:1px solid #e6e3dd;z-index:2;display:flex;gap:8px;align-items:center;padding:10px 16px;overflow-x:auto;white-space:nowrap}
.pbar button{flex:none}
@media(max-width:600px){.frame,.frame svg{width:calc(50vw - 26px)}.board{gap:12px}}
.pbar button{font:inherit;border:1px solid var(--rule);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.pbar .tab{font-weight:600}.pbar .tab.on{background:var(--story);border-color:var(--story);color:#fff}
.pin{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.pin h2{font-size:22px;margin:4px 0 2px}.pin h3{font-size:16px;margin:30px 0 10px;padding-top:12px;border-top:1px solid #eee}
.chip{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.6px;color:#fff;background:var(--story);border-radius:10px;padding:2px 9px}
.story4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media(max-width:760px){.story4{grid-template-columns:1fr 1fr}}
.story4 div{background:var(--storybg);border-radius:8px;padding:8px 10px;font-size:13.5px}.story4 b{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--story);margin-bottom:2px}
.job{border-left:4px solid var(--story);padding:6px 12px;margin-top:12px;font-size:14.5px;background:#fafcf9}
.rq h4{margin:14px 0 4px;font-size:14px}.rq ul{margin:0;padding-left:20px}.rq li{margin:3px 0;font-size:14px}
.src{font-size:11px;font-weight:700;color:var(--muted);margin-left:6px;white-space:nowrap}
.redt{color:var(--red)}
.board{display:flex;flex-wrap:wrap;gap:18px}
.frame{width:190px;border-radius:10px}.frame svg{width:190px;height:auto;display:block}
.frame .cap{font-size:12.5px;margin-top:6px;line-height:1.35}.frame .cap b{display:block;font-size:13px}
.frame .own{display:inline-block;font-size:9.5px;font-weight:700;color:#fff;background:var(--c);border-radius:4px;padding:1px 6px;margin-top:4px}
.frame .own.unk{background:#fbe3e0;color:var(--red);border:1px dashed var(--red)}
.flowbox{overflow-x:auto;border:1px solid #eee;border-radius:10px;background:#fcfbf9}
.flowbox svg{display:block}
table.edge{border-collapse:collapse;width:100%;font-size:13.5px}table.edge th,table.edge td{border:1px solid #e3e0da;padding:7px 9px;text-align:left;vertical-align:top}
table.edge th{background:#f4f2ee}table.edge td.st{white-space:nowrap;font-weight:700;font-size:12px}
.fns{display:flex;flex-wrap:wrap;gap:14px}
/* сайдбар IDEF0 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
.side{position:fixed;top:0;right:0;height:100%;width:min(620px,100%);background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .22s;overflow-y:auto;z-index:9}
body.open .side{transform:none}body.open .scrim{opacity:1;pointer-events:auto}
.side .top{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;padding:14px 18px 10px;z-index:1}
.side .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.6px;color:#fff;background:var(--c);border-radius:4px;padding:2px 7px}
.side .tag.unk{background:#fbe3e0;color:var(--red);border:1px dashed var(--red)}
.side h3{margin:6px 0 2px;font-size:19px}
.side .close{position:absolute;right:12px;top:10px;border:0;background:none;font-size:26px;cursor:pointer;color:var(--muted);line-height:1}
.side .cnt{padding:12px 18px 40px}.side h4{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:20px 0 6px}
.goal{background:var(--storybg);border-left:4px solid var(--story);padding:8px 12px;border-radius:4px;font-size:14.5px}
.idef{width:100%;height:auto;display:block;border:1px solid #eee;border-radius:8px;background:#fcfbf9}
.side ul{margin:0;padding-left:18px}.side li{margin:3px 0;font-size:14px}.side .bl{color:var(--red);font-weight:600}.side .ask{color:var(--red)}
.req{display:grid;grid-template-columns:60px 1fr;gap:2px 10px;font-size:13.5px}.req b{font-weight:700}
/* шапка: только главное, остальное — в «Инструкциях» и «Легенде» */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 14px}
.tool{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:14px;font-weight:650;color:var(--ink);background:#fff;border:1px solid #dcd7cd;border-radius:999px;padding:8px 14px;cursor:pointer}
.tool:hover,.tool:focus-visible{background:#f6f4f0;outline:none}.tool svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* боковые панели «Инструкции» и «Легенда» */
.gd{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .22s;overflow-y:auto;z-index:9}

 </svg><small style="display:block;text-align:center;font-size:12px;color:#6b6b6b;margin-top:6px">${esc(sub||"")}</small></div>`}
function venue(sub){return `<div class="ill"><svg viewBox="0 0 220 230" role="img" aria-label="Ресторан"><path d="M30,90 h160 v120 h-160z" fill="#fff" stroke="#1f1f1f" stroke-width="2"/>

 <rect x="50" y="130" width="50" height="40" rx="4" fill="#f3f0ea" stroke="#1f1f1f"/><rect x="125" y="130" width="45" height="80" rx="4" fill="#f3f0ea" stroke="#1f1f1f"/>
 </svg><small style="display:block;text-align:center;font-size:12px;color:#6b6b6b;margin-top:6px">${esc(sub||"")}</small></div>`}
function bigNum(n,cap,col){return `<div style="text-align:center"><div class="big" style="color:${col||"#1f1f1f"}">${n}</div><div style="color:#6b6b6b;font-size:15px;margin-top:6px">${esc(cap)}</div></div>`}

const seqHidden=(a,b)=>"sx".includes(PART[a][1])||"sx".includes(PART[b][1]);
function seqSVG(q){const P=q.p,CW=150,X0=20,cx=k=>X0+CW*P.indexOf(k)+CW/2;
 const all=[];const walk=ms=>ms.forEach(m=>Array.isArray(m)?all.push(m):(walk(m.a),walk(m.b)));walk(q.m);
 const W=Math.max(X0*2+CW*P.length,...all.filter(m=>m[0]===m[1]).map(m=>cx(m[0])+40+m[2].length*6.3+X0));
 const flat=[];q.m.forEach(m=>{if(Array.isArray(m))flat.push({m});else{flat.push({alt:m.alt});m.a.forEach(x=>flat.push({m:x}));flat.push({els:m.els});m.b.forEach(x=>flat.push({m:x}));flat.push({end:1})}});
 const rowH=m=>m.m?(m.m[0]===m.m[1]?40:34):24;let H=70+flat.reduce((s,x)=>s+rowH(x),0)+16;
 const vis=P.findIndex(k=>"sx".includes(PART[k][1]));
 let s=`<svg class="seq" viewBox="0 0 ${W} ${H}" style="width:${W}px;max-width:100%" role="img" aria-label="Как устроен процесс"><defs><marker id="sq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#3a3a3a"/></marker></defs>`;
 if(vis>0){const xv=X0+CW*vis;s+=`<rect x="${xv}" y="0" width="${W-xv}" height="${H}" fill="#f1f3f7"/><line x1="${xv}" y1="0" x2="${xv}" y2="${H}" stroke="#7d7a73" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${xv+6}" y="${H-6}" font-size="10.5" fill="#7d7a73">за линией видимости — скрыто от гостя</text>`}
 P.forEach(k=>{const x=cx(k),[n,t]=PART[k];s+=`<line x1="${x}" y1="44" x2="${x}" y2="${H-20}" stroke="#c9c4ba" stroke-dasharray="3 4"/>`;
  s+=t==="p"?`<circle cx="${x}" cy="14" r="7" fill="none" stroke="#1c1c1c" stroke-width="1.5"/><path d="M${x-11},34 q11,-14 22,0" fill="none" stroke="#1c1c1c" stroke-width="1.5"/>`+`<text x="${x}" y="46" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1c">${esc(n)}</text>`
   :`<rect x="${x-62}" y="8" width="124" height="30" rx="7" fill="${t==="i"?"#e5f3f4":t==="x"?"#f3f1ec":"#e7edf8"}" stroke="${t==="i"?"#0f8b8d":t==="x"?"#9a958c":"#2563c9"}" stroke-width="1.2"/><text x="${x}" y="27" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1c1c1c">${esc(n)}</text>`});
 let y=70,num=0,altY=0;const xs=P.map(cx),L=Math.min(...xs)-50,R=Math.max(...xs)+50;
 flat.forEach(r=>{
  if(r.alt!==undefined){altY=y;s+=`<text x="${L+6}" y="${y+14}" font-size="10.5" font-weight="800" fill="#6b6b6b">ЕСЛИ ${esc(r.alt)}</text>`;y+=24;return}
  if(r.els!==undefined){s+=`<line x1="${L}" y1="${y+2}" x2="${R}" y2="${y+2}" stroke="#9a958c" stroke-dasharray="5 4"/><text x="${L+6}" y="${y+16}" font-size="10.5" font-weight="800" fill="#6b6b6b">ИНАЧЕ ${esc(r.els)}</text>`;y+=24;return}
  if(r.end){s+=`<rect x="${L}" y="${altY}" width="${R-L}" height="${y-altY+4}" rx="6" fill="none" stroke="#9a958c"/>`;y+=8;return}
  const [a,b,lab,o]=r.m;num++;const xa=cx(a),xb=cx(b),hid=seqHidden(a,b),col=hid?"#2563c9":"#1c1c1c",red=lab.includes("УТОЧНИТЬ");
  const badge=(x)=>`<circle cx="${x}" cy="${y}" r="8" fill="${hid?"#2563c9":"#2f6b2a"}"/><text x="${x}" y="${y+3.5}" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle">${num}</text>`;
  if(a===b){s+=`<path d="M${xa},${y} h28 v16 h-26" fill="none" stroke="${col}" stroke-width="1.4" marker-end="url(#sq)"/><text x="${xa+34}" y="${y+12}" font-size="11.5" fill="${red?"#c0392b":col}">${esc(lab)}</text>`+badge(xa-12);y+=40;return}
  const dir=xb>xa?1:-1,tx=(xa+xb)/2;s+=`<line x1="${xa}" y1="${y}" x2="${xb-dir*2}" y2="${y}" stroke="${col}" stroke-width="1.4" ${o==="r"?'stroke-dasharray="5 4"':""} marker-end="url(#sq)"/>`;
  s+=`<text x="${tx}" y="${y-6}" font-size="11.5" text-anchor="middle" fill="${red?"#c0392b":col}">${esc(lab)}</text>`+badge(xa+dir*14);y+=34});
 return s+"</svg>"}
function seqHiddenList(q){const out=[];let num=0;const walk=ms=>ms.forEach(m=>{if(Array.isArray(m)){num++;if(seqHidden(m[0],m[1]))out.push([num,m])}else{walk(m.a);walk(m.b)}});walk(q.m);return out}

 const hwb=t.closest(".hw");if(hwb){e.stopPropagation();const [ly]=hwb.dataset.h.split(":");return openProc(hwb.dataset.fn,ly,hwb.querySelector("span").textContent)}
 const fxb=t.closest("[data-fn]");if(fxb){e.stopPropagation();return openFn(fxb.dataset.fn)}
 const fp=t.closest("[data-fail]");if(fp){e.stopPropagation();return openGuide("fail",fp.dataset.fail)}
 const gb=t.closest("[data-guide]");if(gb)return openGuide(gb.dataset.guide);
 const bc=t.closest(".blkc");if(bc){body.classList.remove("guide");return openFn(bc.dataset.k.slice(1))}
 const fr=t.closest("[data-scr]")||t.closest(".sf")?.querySelector("[data-scr]");if(fr){const g=SCRGO[fr.dataset.scr];return g[0]==="F"?openFn(g[1]):openPage(g[0],g[1])}
 const stc=t.closest("[data-st]");if(stc){const [w,i]=stc.dataset.st.split(":");return openShow(w,+i)}
 const tp=t.closest("[data-tp]");if(tp){const [k,id]=tp.dataset.tp.split(":");return openPage(k,id)}
 const pg=t.closest("[data-page]");if(pg){closeSide();return openPage(pg.dataset.page)}
 const c=t.closest(".fn,.sec");if(!c)return;const k=c.dataset.k;if(k[0]==="S")return openPage(k.slice(1));if(k[0]==="F")return openFn(k.slice(1))});
document.getElementById("scrim").onclick=closeSide;document.getElementById("gClose").onclick=closeSide;document.getElementById("sClose").onclick=closeSide;
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(body.classList.contains("showing"))body.classList.remove("showing");else if(body.classList.contains("open")||body.classList.contains("guide"))closeSide();else closePage()});
window.addEventListener("load",()=>{const h=decodeURIComponent(location.hash.slice(1));if(SEC[h])openPage(h)});
</script></body></html>
