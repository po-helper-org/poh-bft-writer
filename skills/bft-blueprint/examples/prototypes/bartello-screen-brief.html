<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бриф экрана — прототип</title><style>:root{--ink:#1c1c1c;--muted:#6b6b6b;--line:#e7e3dc;--soft:#f6f4f0;--red:#c0392b;--story:#2f6b2a}
*{box-sizing:border-box}body{margin:0;background:#8f8b85;font:15px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
.sw{position:fixed;top:16px;left:16px;display:flex;gap:6px;background:#fff;border-radius:12px;padding:4px}.sw button{border:0;background:none;border-radius:9px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:#55524c}.sw button.on{background:var(--ink);color:#fff}
#panel{position:fixed;top:0;right:0;width:min(760px,100%);height:100%;overflow-y:auto;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.ph{position:sticky;top:0;z-index:2;background:#fff;display:flex;justify-content:space-between;gap:16px;padding:22px 28px 16px;border-bottom:1px solid var(--line)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#6b3fd4;background:#f0ebfb;border-radius:6px;padding:3px 8px}
.ph h1{margin:8px 0 4px;font-size:22px;line-height:1.25;letter-spacing:-.2px}.meta{font-size:13px;color:var(--muted)}.prog b{color:var(--story)}.unk{color:var(--red);font-weight:600}
.x{border:0;background:none;font-size:26px;color:var(--muted);cursor:pointer;align-self:flex-start}
.pb{padding:4px 28px 40px}
h2{font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}h2 small{text-transform:none;letter-spacing:0;font-weight:500;margin-left:6px}
.why{display:flex;gap:22px;margin-top:20px}.shots{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}.shots img{width:96px;display:block}.shots img+img{margin-top:4px}.shots small{font-size:11px;color:#9a958c}
.wt{flex:1;min-width:0}.job{font-size:17px;line-height:1.5;font-weight:500;margin-bottom:14px}
dl{display:grid;grid-template-columns:76px 1fr;gap:8px 10px;margin:0;font-size:14px}dt{color:var(--muted);font-size:13px;padding-top:2px}dd{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lnk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 3px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none}.lnk img{width:18px;height:24px;object-fit:cover;object-position:top;border-radius:4px}.lnk.ev{padding:2px 10px;font-weight:500;color:#55524c;background:var(--soft);border-color:transparent}
.refs{margin-left:auto;display:inline-flex;flex-wrap:wrap;gap:3px;padding-left:8px}.refs i{font-style:normal;font-size:10.5px;font-weight:600;color:#7a766e;background:var(--soft);border-radius:5px;padding:1px 6px;white-space:nowrap}
.job .refs,dd .refs{margin-left:6px;vertical-align:2px}
input[type=checkbox]{flex:none;width:17px;height:17px;margin:2px 0 0;accent-color:var(--story);cursor:pointer}
ol.prio,ul.prio2,ul.lim,ul.chk{list-style:none;margin:0;padding:0}
ol.prio{counter-reset:p}ol.prio li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--soft);margin-bottom:6px;font-size:15px;font-weight:600}
ol.prio li::after{counter-increment:p;content:counter(p);order:-1;flex:none;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
ul.prio2 li{display:flex;gap:10px;padding:6px 12px 6px 42px;font-size:14px;color:#55524c}
.acts{display:flex;flex-direction:column;gap:8px}.act{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
.btn{background:var(--ink);color:#fff;border-radius:999px;padding:6px 14px;font-weight:650}.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}.when{color:var(--muted)}.to{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.states{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.st{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}.st b{font-size:13.5px}.st span{color:#55524c}.st .refs{margin:2px 0 0;padding:0}
.st.ideal{border-color:#cfe2c8;background:#f3f8f0}.st.q{border:1.5px dashed #e3a49c;background:#fdf6f5}.who{color:var(--red);font-weight:700}
ul.lim li,ul.chk li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
ul.chk .g{color:var(--muted)}ul.chk .ar{margin:0 8px;color:#9a958c}
.srcd{margin-top:26px;border-top:1px solid var(--line);padding-top:10px}.srcd summary{cursor:pointer;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.srcd pre{font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);border-radius:12px;padding:14px;white-space:pre-wrap;font-variant-ligatures:none}

действия:

  онлайн-мероприятие: блока акции нет · ФТ-2
  нет ресторанов рядом с площадкой: [УТОЧНИТЬ у PO]
  мероприятие вне Москвы и Санкт-Петербурга: [УТОЧНИТЬ у PO] показывать ли блок
ограничения:
  Тексты без склонений названий мероприятий; проверка на «Королевские игры», «Mamma Mia», «Ленком» · НФТ-3
  Фиолетовая айдентика акции, один дизайнер на все блоки · НФТ-4
  События блока размечены в Метрике · ФТ-2
проверка:
  Купил офлайн-билет → на странице после оплаты есть блок акции и полка ресторанов
  Купил билет на онлайн-мероприятие → блока акции нет
  Название мероприятия любого рода и числа → текст блока читается без ошибок
```

```screen F3
экран: Приложение-сканер — результат проверки
задача: Когда официант отсканировал билет, хочет сразу понять, давать ли скидку и почему, чтобы не спорить с гостем · ФТ-1, ФТ-8
цель: Одна покупка — одна скидка, без конфликта у стола · ПТ-1
откуда: F2 Сканирование штрихкода
дальше: F5 Фото чека; F6 Инструкция и FAQ
главное:
  Результат: скидка 10% или отказ · ИТ-8
  Причина отказа понятными словами · ФТ-1
дополнительно:
  Путь к инструкции и поддержке при отказе · ФТ-13
действия:
  главное: Сфотографировать чек → F5 · ИТ-8
  при отказе: Инструкция и поддержка → F6 · ФТ-13
состояния:
  валиден: «Скидка 10%», билет помечен «использован» · ФТ-1
  уже использован: отказ с причиной «использован» · ФТ-1
  вне окна 7 дней: отказ с причиной · ФТ-1
  билет возвращён: [УТОЧНИТЬ у PO] остаётся ли скидка · ФТ-15
  мероприятие отменено или перенесено: [УТОЧНИТЬ у Bartello] · ФТ-15
  штрихкод не читается: [УТОЧНИТЬ у Bartello] ручной ввод или отказ · ФТ-1
  нет интернета у ресторана: [УТОЧНИТЬ у Bartello] · ФТ-8
  сервис проверки недоступен: [УТОЧНИТЬ у Bartello] · ФТ-1, НФТ-1
ограничения:
  Отдельное приложение, не обязательно нативное · ИТ-8
  Фиолетовая айдентика акции · НФТ-4
проверка:
  Отсканировал действующий билет → вижу «Скидка 10%» и следующий шаг — фото чека
  Сканирую тот же билет второй раз → отказ «использован» с причиной
  Билет вне окна 7 дней → отказ с понятной причиной
```
