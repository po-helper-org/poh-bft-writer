# Коробка БФТ: docker compose up -d  (демо без ключа модели: docker compose --profile demo up -d)
# Состав (ADR 0002): postgres (общий для Temporal и данных коробки), temporal, box-worker, box-mcp,
# temporal-ui — в профиле debug. Лимиты памяти обязательны: сервер владельца тесный.
name: poh-bft-box

x-box: &box
  build: .
  image: poh-bft-box:local
  restart: unless-stopped
  environment: &box-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-box}:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/box
    TEMPORAL_ADDRESS: temporal:7233
    LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-gpt-4o}
    BOX_TOKENS: ${BOX_TOKENS:?задайте BOX_TOKENS в .env, например hermes:секрет,ui:секрет}
    BOX_ADMINS: ${BOX_ADMINS:-ui}
    TEMPORAL_UI_URL: ${TEMPORAL_UI_URL:-http://127.0.0.1:8233}
  depends_on:
    temporal: {condition: service_healthy}
    postgres: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-box}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: box
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-box} -d box"]
      interval: 5s
      retries: 20
    mem_limit: 256m

  temporal:
    image: temporalio/auto-setup:1.27.2
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-box}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health | grep -q SERVING"]
      interval: 10s
      retries: 30
      start_period: 30s
    mem_limit: 640m

  temporal-ui:
    image: temporalio/ui:2.36.1
    profiles: [debug]
    restart: unless-stopped
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["${BOX_BIND:-127.0.0.1}:8233:8080"]
    mem_limit: 128m

  box-worker:
    <<: *box
    command: ["python", "-m", "bftbox.worker"]
    ports: ["${BOX_BIND:-127.0.0.1}:9101:9101"]   # метрики вызовов модели (коллектор → Grafana)
    mem_limit: 256m

  box-mcp:
    <<: *box
    ports: ["${BOX_BIND:-127.0.0.1}:8700:8700"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/health')"]
      interval: 10s
      retries: 10
    mem_limit: 256m

  llm-demo:   # модель-двойник для демо без ключа: LLM_BASE_URL=http://llm-demo:8710/v1 в .env
    <<: *box
    profiles: [demo]
    command: ["python", "-m", "bftbox.demo_llm"]
    depends_on: {}
    mem_limit: 64m

volumes:
  pgdata:
