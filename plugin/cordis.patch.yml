# Раздел «Управление требованиями» poh-bft-writer: очередь БФТ, документы,
# доска стадий.
#
# Файл едет вместе с пакетом и применяется на любой машине, поэтому путей
# конкретного компьютера здесь нет. Обязательный workspaceRoot задаётся слоем
# профиля — точечной правкой по идентификатору `bft-requirements`:
#
#   - id: bft-requirements
#     config:
#       workspaceRoot: '/путь/к/воркспейсу'
#
# Пока он не задан, плагин поднимается и сразу говорит, чего ему не хватает,
# а не показывает пустой экран.
#
# docsPath — умолчание этого репозитория (`bft-config.template.md`). Воркспейсы
# с прежней раскладкой (`bft/documentation`) подхватываются запасным путём;
# заданное значение запасных не имеет.
#
# backlogBin задан умолчанием: без доски требование, заведённое агентом, не видно
# в разделе до первого прогона /bft-fast — то есть ровно тогда, когда на него и
# нужно смотреть. Отсутствие бинаря в PATH не ошибка: запуск возвращает код -1,
# и очередь остаётся той же, что была бы без доски. Стадию доска не переписывает —
# она выведена из артефактов на диске.
#
# Секретов здесь быть не должно: файл лежит в репозитории.
- insert:
    - id: bft-requirements
      name: poh-bft-plugin
      config:
        backlogBin: backlog
        docsPath: .bft/documentation
        indexPath: .bft/index
        taskType: bft
