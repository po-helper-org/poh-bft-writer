# data-sources: корпоративные источники данных портала БФТ (Jira, Confluence).
# Каждый источник — удалённый MCP с OAuth; подключает администратор в
# «Настройках → Источники данных», токены — в томе /data/data-sources.
# Или служебный токен шлюза агентов из окружения DATA_SOURCES_TOKEN_<ID>
# (для po-hq — DATA_SOURCES_TOKEN_PO_HQ): без OAuth, так работает сервер.
# Адрес MCP — из окружения DATA_SOURCES_URL_<ID> (для po-hq —
# DATA_SOURCES_URL_PO_HQ) или полем url ниже; не задан — источник «не настроен».
# Портал зовёт только инструменты чтения (белый список в src/sources.ts).
- insert:
    - id: data-sources
      name: data-sources
      config:
        sources:
          # MCP-шлюз агентов: корпоративные Jira и Confluence.
          - id: po-hq
            name: Шлюз агентов
            scope: staff
